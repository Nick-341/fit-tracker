<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fit-Tracker</title>
<meta name="theme-color" content="#16202A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Fit-Tracker">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0EF;--surface:#FFFFFF;--ink:#16202A;--muted:#5D6A75;--line:#D3DAD9;--soft:#E2E7E6;
  --a:#2B4DDB;--b:#0E8064;--warn:#B42318;
  --fd:'Barlow Condensed',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;
  --fb:'Barlow',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0F151B;--surface:#18212B;--ink:#E7ECEF;--muted:#94A2AD;--line:#2B3744;--soft:#243040;
  --a:#8197FF;--b:#3FCB9F;--warn:#FF8A7A;}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:16px/1.45 var(--fb);-webkit-text-size-adjust:100%;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--fd);font-weight:600;letter-spacing:.01em;margin:0}
h2{font-size:24px}h3{font-size:22px}
.muted{color:var(--muted)}.err{color:var(--warn)}.small{font-size:14px}
.pad{padding:16px}

/* Kopfzeile */
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top,0px) + 8px) 16px 8px;border-bottom:1px solid var(--line)}
.top-in{max-width:560px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px}
.daynav{display:flex;align-items:center;gap:2px}
.daynav button{background:none;border:0;padding:8px 10px;font-family:var(--fd);font-size:22px;font-weight:600;cursor:pointer;border-radius:8px}
.daynav button:disabled{opacity:.25}
#dayl{min-width:120px}
.who{display:flex;background:var(--soft);border-radius:999px;padding:3px}
.who button{border:0;background:none;padding:6px 12px;border-radius:999px;font-weight:600;font-size:14px;cursor:pointer;color:var(--muted)}
.who button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.who button.on.a{color:var(--a)}.who button.on.b{color:var(--b)}

main{max-width:560px;margin:0 auto;padding:12px 16px calc(96px + env(safe-area-inset-bottom,0px))}

/* Untere Navigation */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{border:0;background:none;padding:14px 0 12px;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer;border-top:3px solid transparent}
.tabs button.on{color:var(--ink);border-top-color:var(--a)}
body:not(.in) .top,body:not(.in) .tabs{display:none}

/* Personenkarte */
.person{background:var(--surface);border-radius:14px;padding:16px 16px 14px;margin-bottom:12px;border-left:6px solid var(--c)}
.person.a{--c:var(--a)}.person.b{--c:var(--b)}
.person .name{font-family:var(--fd);font-size:20px;font-weight:600;color:var(--c)}
.big{font-family:var(--fd);font-size:52px;line-height:1;font-weight:700;letter-spacing:-.01em;margin:6px 0 2px}
.big small{font-size:20px;font-weight:600;color:var(--muted);margin-left:4px}
.big.over{color:var(--warn)}
.bar{height:10px;background:var(--soft);border-radius:5px;overflow:hidden;margin:4px 0 10px}
.bar>i{display:block;height:100%;background:var(--c,var(--a));border-radius:5px}
.bar.over>i{background:var(--warn)}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.macro .lbl{font-size:13px;color:var(--muted)}
.macro .val{font-weight:600;font-size:15px}
.macro .bar{height:6px;margin:3px 0 0}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:14px}
.facts b{display:block;font-weight:600;font-size:15px}

/* Abschnitte & Listen */
.sec{margin:22px 0 8px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.list{background:var(--surface);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:500;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:13px;color:var(--muted)}
.row .k{font-weight:600;white-space:nowrap}
.row.tap{cursor:pointer}
.note{background:var(--surface);border-radius:14px;padding:14px;color:var(--muted);font-size:15px}
.slot-h{display:flex;justify-content:space-between;padding:10px 14px;background:var(--soft);font-weight:600;font-size:14px}

/* Buttons & Formulare */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:10px;padding:11px 16px;font-weight:600;cursor:pointer;background:var(--ink);color:var(--bg);min-height:44px}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.line{background:none;border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:none;color:var(--warn);border:1px solid var(--line)}
.btn.sm{padding:6px 12px;min-height:34px;font-size:14px;border-radius:8px}
.btn.full{width:100%}
.btn.done{background:var(--soft);color:var(--b)}
.iconbtn{border:0;background:none;color:var(--muted);font-size:20px;line-height:1;padding:6px 8px;cursor:pointer;border-radius:8px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
:focus-visible{outline:2px solid var(--a);outline-offset:2px}
.f{display:block;margin-bottom:12px}
.f>span{display:block;font-size:14px;color:var(--muted);margin-bottom:4px}
input,select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;font-size:16px}
textarea{min-height:120px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:0 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip span{display:inline-block;padding:8px 12px;border-radius:999px;background:var(--soft);font-weight:600;font-size:14px;cursor:pointer}
.chip input:checked+span{background:var(--ink);color:var(--bg)}
.chip input:focus-visible+span{outline:2px solid var(--a)}
.check{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.check input{width:22px;height:22px;min-height:0}
.card{background:var(--surface);border-radius:14px;padding:16px}

/* Rechner */
.calc-out{background:var(--surface);border-radius:14px;padding:16px;margin-top:4px}
.calc-line{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--line);font-size:15px}
.calc-line:last-child{border-bottom:0}
.calc-line span:first-child{color:var(--muted)}
.tgt{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:12px}
.tgt div{background:var(--soft);border-radius:10px;padding:10px 12px}
.tgt b{font-family:var(--fd);font-size:30px;display:block;line-height:1.1}
.warnbox{margin-top:10px;color:var(--warn);font-size:14px}

/* Bottom Sheet */
.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet.hidden{display:none}
.sheet-bg{position:absolute;inset:0;background:rgba(10,15,20,.45)}
.sheet-card{position:relative;background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet-card{animation:none}}
.sh-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}
.seg{display:flex;background:var(--soft);border-radius:10px;padding:3px;margin-bottom:14px;overflow-x:auto}
.seg button{flex:1;border:0;background:none;padding:8px 10px;border-radius:8px;font-weight:600;font-size:14px;white-space:nowrap;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink)}
#reader{width:100%;border-radius:12px;overflow:hidden;background:#000;min-height:220px}
.searchrow{display:flex;gap:8px;margin-bottom:12px}
.searchrow input{flex:1}
.quick{display:flex;gap:6px;margin:-4px 0 12px}
.quick button{flex:1}

/* Training */
.ex{background:var(--surface);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.ex-h{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.ex-h input{font-weight:600}
.last{font-size:13px;color:var(--muted);margin-bottom:6px}
.setrow{display:grid;grid-template-columns:26px 1fr 14px 1fr 40px 32px;gap:6px;align-items:center;margin-bottom:6px}
.setrow .n{color:var(--muted);font-weight:600;text-align:center}
.setrow input{text-align:center;padding:8px 4px}
details.wo{background:var(--surface);border-radius:14px;margin-bottom:8px}
details.wo summary{padding:12px 14px;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:8px}
details.wo summary::-webkit-details-marker{display:none}
details.wo .body{padding:0 14px 12px;font-size:15px}
details.wo .body p{margin:4px 0}

/* Körper */
.chart{background:var(--surface);border-radius:14px;padding:12px;color:var(--c,var(--a))}
.chart svg{width:100%;height:auto;display:block}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.stats div{background:var(--surface);border-radius:12px;padding:10px}
.stats b{font-family:var(--fd);font-size:26px;display:block;line-height:1.1}
.stats span{font-size:13px;color:var(--muted)}
table.m{width:100%;border-collapse:collapse;background:var(--surface);border-radius:14px;overflow:hidden;font-size:15px}
table.m th,table.m td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line)}
table.m th:first-child,table.m td:first-child{text-align:left}
table.m th{font-weight:600;color:var(--muted);font-size:13px}

/* Login */
.auth{max-width:420px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 48px) 20px 40px}
.auth h1{font-size:48px;line-height:1;margin-bottom:8px}
.auth .rings{display:flex;margin-bottom:20px}
.auth .rings i{width:44px;height:44px;border-radius:50%;border:6px solid var(--a)}
.auth .rings i+i{border-color:var(--b);margin-left:-14px}

#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}
#toast.show{opacity:1}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="daynav" id="daynav">
    <button id="prev" aria-label="Vorheriger Tag">‹</button>
    <button id="dayl" aria-label="Zu heute springen"></button>
    <button id="next" aria-label="Nächster Tag">›</button>
  </div>
  <div class="who" id="who"></div>
</div></header>
<main id="view"></main>
<nav class="tabs"><div class="tabs-in" id="tabs">
  <button data-tab="heute">Heute</button>
  <button data-tab="essen">Essen</button>
  <button data-tab="training">Training</button>
  <button data-tab="koerper">Körper</button>
  <button data-tab="profil">Profil</button>
</div></nav>
<div id="sheet" class="sheet hidden"><div class="sheet-bg" onclick="closeSheet()"></div><div class="sheet-card" id="sheetBody"></div></div>
<div id="toast" role="status"></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
/* ================= Hilfsfunktionen ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const x = parseFloat(String(v ?? '').replace(',', '.')); return isFinite(x) ? x : 0; };
const r0 = n => Math.round(+n || 0);
const r1 = n => Math.round((+n || 0) * 10) / 10;
const fmt = n => r0(n).toLocaleString('de-DE');
const fmt1 = n => r1(n).toLocaleString('de-DE', {minimumFractionDigits: 1, maximumFractionDigits: 1});
const z = n => String(n).padStart(2, '0');
const ds = d => `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`;
const today = () => ds(new Date());
const addDays = (s, n) => { const d = new Date(s + 'T12:00:00'); d.setDate(d.getDate() + n); return ds(d); };
const daysBetween = (a, b) => Math.round((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 864e5);
const wd = s => (new Date(s + 'T12:00:00').getDay() + 6) % 7; // 0 = Montag
const WD = ['Mo','Di','Mi','Do','Fr','Sa','So'];
const SLOTS = [['fruehstueck','Frühstück'],['mittag','Mittagessen'],['abend','Abendessen'],['snack','Snacks']];
const slotName = k => (SLOTS.find(s => s[0] === k) || [0,'Sonstiges'])[1];
const shortDate = s => new Date(s + 'T12:00:00').toLocaleDateString('de-DE', {day:'numeric', month:'numeric'});
function dayLabel(s){
  if (s === today()) return 'Heute';
  if (s === addDays(today(), -1)) return 'Gestern';
  return new Date(s + 'T12:00:00').toLocaleDateString('de-DE', {weekday:'short', day:'numeric', month:'short'});
}
let toastT;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2400); }
const scale = (per, g) => { const k = (+g || 0) / 100; return {kcal: per.kcal*k, p: per.p*k, c: per.c*k, f: per.f*k}; };
const addN = (a, b) => ({kcal: a.kcal + (+b.kcal||0), p: a.p + (+b.p||0), c: a.c + (+b.c||0), f: a.f + (+b.f||0)});
const ZERO = {kcal:0, p:0, c:0, f:0};
const sum = logs => logs.reduce((a, l) => addN(a, l.data), ZERO);
const roundN = v => ({kcal: r0(v.kcal), p: r1(v.p), c: r1(v.c), f: r1(v.f)});
const recipeTotals = (r, factor = 1) => (r.items || []).reduce((a, i) => addN(a, scale(i.per, i.grams * factor)), ZERO);

/* ================= Supabase & Zustand ================= */
const cfg = window.APP_CONFIG || {};
let sb = null;
const S = { user:null, me:null, partner:null, who:'me', day: today(), tab:'heute', rc:{}, rt:{} };
const viewId = () => (S.who === 'partner' && S.partner) ? S.partner.id : S.user.id;
const own = () => viewId() === S.user.id;
const nameOf = p => p?.display_name || 'Partner';

async function q(kind, uid, from, to){
  let r = sb.from('entries').select('*').eq('user_id', uid).eq('kind', kind);
  if (from) r = r.gte('day', from);
  if (to) r = r.lte('day', to);
  const { data, error } = await r.order('day', {ascending:true, nullsFirst:true}).order('created_at');
  if (error) throw error;
  return data || [];
}
async function add(kind, day, data){
  const { data: row, error } = await sb.from('entries').insert({ kind, day, data }).select().single();
  if (error) throw error; return row;
}
async function upd(id, data, day){
  const patch = { data }; if (day !== undefined) patch.day = day;
  const { error } = await sb.from('entries').update(patch).eq('id', id);
  if (error) throw error;
}
async function del(id){ const { error } = await sb.from('entries').delete().eq('id', id); if (error) throw error; }
async function saveProfile(patch, name){
  S.me.data = { ...S.me.data, ...patch };
  if (name !== undefined) S.me.display_name = name;
  const { error } = await sb.from('profiles').update({ data: S.me.data, display_name: S.me.display_name, updated_at: new Date().toISOString() }).eq('id', S.user.id);
  if (error) throw error;
}
async function loadProfiles(){
  let { data, error } = await sb.from('profiles').select('*').eq('id', S.user.id).maybeSingle();
  if (error) throw error;
  if (!data){
    const name = S.user.user_metadata?.name || S.user.email.split('@')[0];
    const r = await sb.from('profiles').insert({ id: S.user.id, display_name: name }).select().single();
    if (r.error) throw r.error; data = r.data;
  }
  S.me = data; S.partner = null;
  if (data.partner_id){
    const r = await sb.from('profiles').select('*').eq('id', data.partner_id).maybeSingle();
    S.partner = r.data || null;
  }
  if (!S.partner) S.who = 'me';
}
async function loadRecipes(){
  const ids = [S.user.id, S.partner?.id].filter(Boolean);
  const lists = await Promise.all(ids.map(id => q('recipe', id)));
  S.rc = {}; lists.flat().forEach(r => S.rc[r.id] = r);
  return lists.flat();
}
function run(fn){ return (...a) => Promise.resolve(fn(...a)).catch(e => toast('Fehler: ' + (e.message || e))); }

/* ================= Kalorienrechner ================= */
const TRAIN_TYPES = {
  kraft:       ['Krafttraining, moderat', 3.5],
  kraft_hart:  ['Krafttraining, intensiv', 5],
  mix:         ['Kraft + Ausdauer gemischt', 5.5],
  cardio:      ['Ausdauer, moderat', 7],
  cardio_hart: ['Ausdauer, intensiv', 10]
};
function calc(d){
  const w = num(d.weight), h = num(d.height), age = new Date().getFullYear() - num(d.birthYear), bf = num(d.bf);
  if (!w || !h || !num(d.birthYear)) return { ok:false };
  let bmr, method;
  if (bf > 3 && bf < 60){ bmr = 370 + 21.6 * w * (1 - bf/100); method = 'Katch-McArdle (mit Körperfett)'; }
  else { bmr = 10*w + 6.25*h - 5*age + (d.sex === 'm' ? 5 : -161); method = 'Mifflin-St Jeor'; }
  const base = bmr * 1.2;                                        // Grundumsatz + leichter Alltag + Verdauung
  const stepsK = Math.max(0, num(d.steps) - 3000) * 0.0005 * w;  // zusätzliche Schritte
  const restTdee = base + stepsK;
  const met = (TRAIN_TYPES[d.trainType] || TRAIN_TYPES.kraft)[1];
  const sessionK = (met - 1) * w * (num(d.sessionMin) / 60);     // Netto-Mehrverbrauch pro Einheit
  const sessions = num(d.sessions);
  const avgTdee = restTdee + sessionK * sessions / 7;
  const warn = [];
  let adj = 0;
  if (d.goal === 'cut')    adj = -(num(d.rate) / 100 * w * 7700 / 7);
  if (d.goal === 'bulk')   adj =  (num(d.rate) / 100 * w * 7700 / 30.4);
  if (d.goal === 'recomp') adj = -0.05 * avgTdee;
  if (d.goal === 'cut' && -adj > avgTdee * 0.25){ adj = -avgTdee * 0.25; warn.push('Das Defizit wurde auf 25 % deines Verbrauchs begrenzt. Ein langsameres Tempo schützt Muskulatur und Leistung.'); }
  const adaptive = num(d.adaptiveTdee);
  const factor = adaptive ? adaptive / avgTdee : 1;
  const pG = num(d.protein) * w, fG = num(d.fat) * w;
  const mk = kcal => {
    const c = (kcal - pG*4 - fG*9) / 4;
    if (c < 50) warn.push('Bei diesen Werten bleiben kaum Kohlenhydrate übrig. Prüfe Protein und Fett.');
    return { kcal: r0(kcal), p: r0(pG), f: r0(fG), c: r0(Math.max(0, c)) };
  };
  const cycle = !!d.cycle && sessions > 0;
  const targets = {
    cycle, trainDays: d.trainDays || [],
    avg:   mk(avgTdee * factor + adj),
    rest:  mk(restTdee * factor + adj),
    train: mk((restTdee + sessionK) * factor + adj)
  };
  if (pG && num(d.protein) > 2.5) warn.push('Mehr als 2,5 g Protein pro kg bringt in der Regel keinen Zusatznutzen.');
  return { ok:true, bmr, method, base, stepsK, restTdee, sessionK, avgTdee, adj, factor, adaptive, targets, warn:[...new Set(warn)] };
}
function targetFor(p, day, trained){
  const t = p?.data?.targets; if (!t) return null;
  if (!t.cycle) return t.avg;
  return (trained || (t.trainDays || []).includes(wd(day))) ? t.train : t.rest;
}

/* ================= Rahmen ================= */
let RT = 0;
function renderHeader(){
  $('#dayl').textContent = dayLabel(S.day);
  $('#next').disabled = S.day >= today();
  $('#daynav').style.visibility = S.tab === 'profil' ? 'hidden' : 'visible';

    : '';

}
async function render(){
  const t = ++RT;
  renderHeader();
  const v = $('#view');
  if (!v.dataset.tab || v.dataset.tab !== S.tab) v.innerHTML = '<p class="muted pad">Lädt …</p>';
  try {
    const html = await ({ heute:rHeute, essen:rEssen, training:rTraining, koerper:rKoerper, profil:rProfil })[S.tab]();

function setWho(w){ S.who = w; render(); }
function openSheet(html){ $('#sheetBody').innerHTML = html; $('#sheet').classList.remove('hidden'); }
function closeSheet(){ stopScan(); $('#sheet').classList.add('hidden'); $('#sheetBody').innerHTML = ''; }

/* ================= Heute ================= */
async function rHeute(){
  const ppl = [S.me, S.partner].filter(Boolean);
  const data = await Promise.all(ppl.map(async p => {
    const [logs, wos, ws] = await Promise.all([ q('log', p.id, S.day, S.day), q('workout', p.id, S.day, S.day), q('weight', p.id, addDays(S.day, -90), S.day) ]);
    return { p, logs, wos, w: ws.at(-1) };
  }));
  let h = data.map(personCard).join('');
  if (!S.partner) h += `<div class="note">Verknüpfe deinen Partner unter Profil. Danach seht ihr hier eure beiden Tage untereinander.</div>`;
  await loadRecipes();
  const plan = Object.values(S.rc).filter(r => r.user_id === S.user.id && (r.data.days || []).includes(wd(S.day)))
    .sort((a, b) => SLOTS.findIndex(s => s[0] === a.data.slot) - SLOTS.findIndex(s => s[0] === b.data.slot));
  h += `<div class="sec"><div class="sec-h"><h2>Mein Plan für ${WD[wd(S.day)]}</h2></div>`;
  if (!plan.length) h += `<div class="note">Für diesen Wochentag ist nichts geplant. Lege unter Essen eine Mahlzeiten-Vorlage an und wähle die Wochentage aus.</div>`;
  else {
    h += '<div class="list">' + plan.map(r => {
      const done = data[0].logs.find(l => l.data.recipe_id === r.id);
      const t = recipeTotals(r, r.data.factor || 1);
      return `<div class="row"><div class="grow"><div class="t">${esc(r.data.name)}</div><div class="s">${slotName(r.data.slot)}, ${fmt(t.kcal)} kcal, ${fmt(t.p)} g Protein</div></div>
        ${done ? `<button class="btn sm done" onclick="planUndo('${done.id}')">Gegessen ✓</button>` : `<button class="btn sm" onclick="planDo('${r.id}')">Abhaken</button>`}</div>`;
    }).join('') + '</div>';
  }
  return h + '</div>';
}
function personCard({ p, logs, wos, w }){
  const me = p.id === S.user.id;
  const tot = sum(logs), tgt = targetFor(p, S.day, wos.length > 0), t = p.data?.targets;
  let big, sub;
  if (tgt){
    const left = tgt.kcal - tot.kcal;
    big = left >= 0 ? `<div class="big">${fmt(left)}<small>kcal übrig</small></div>` : `<div class="big over">${fmt(-left)}<small>kcal drüber</small></div>`;
    sub = `${fmt(tot.kcal)} von ${fmt(tgt.kcal)} kcal${t.cycle ? (tgt === t.train ? ', Trainingstag' : ', Ruhetag') : ''}`;
  } else {
    big = `<div class="big">${fmt(tot.kcal)}<small>kcal</small></div>`;
    sub = me ? 'Noch keine Ziele. Berechne sie unter Profil.' : 'Noch keine Ziele hinterlegt.';
  }
  const bar = (v, g) => { const pc = g ? Math.min(100, v / g * 100) : 0; return `<div class="bar ${g && v > g * 1.05 ? 'over' : ''}"><i style="width:${pc}%"></i></div>`; };
  const macro = (lbl, v, g) => `<div class="macro"><div class="lbl">${lbl}</div><div class="val">${fmt(v)}${g ? ` / ${fmt(g)}` : ''} g</div>${bar(v, g)}</div>`;
  return `<section class="person ${me ? 'a' : 'b'}">
    <div class="name">${esc(me ? (p.display_name || 'Ich') : nameOf(p))}</div>
    ${big}<div class="small muted">${sub}</div>
    ${tgt ? bar(tot.kcal, tgt.kcal) : '<div style="height:10px"></div>'}
    <div class="macros">${macro('Protein', tot.p, tgt?.p)}${macro('Kohlenhydrate', tot.c, tgt?.c)}${macro('Fett', tot.f, tgt?.f)}</div>
    <div class="facts">
      <div><span class="muted">Training</span><b>${wos.length ? esc(wos.map(x => x.data.name).join(', ')) : 'Nichts eingetragen'}</b></div>
      <div><span class="muted">Gewicht</span><b>${w ? fmt1(w.data.kg) + ' kg' + (w.day !== S.day ? ` <span class="muted small">(${shortDate(w.day)})</span>` : '') : 'Kein Eintrag'}</b></div>
    </div></section>`;
}

async function rEssen(){
  const uid = viewId(), mine = own(), p = mine ? S.me : S.partner;

    <div class="small muted">Protein ${fmt(tot.p)}${tgt ? '/' + tgt.p : ''} g, Kohlenhydrate ${fmt(tot.c)}${tgt ? '/' + tgt.c : ''} g, Fett ${fmt(tot.f)}${tgt ? '/' + tgt.f : ''} g</div></div>`;

    if (mine) h += `<div class="row"><button class="btn sm ghost" onclick="openPicker({mode:'log',slot:'${k}',title:'${label}'})">+ Hinzufügen</button></div>`;
    else if (!items.length) h += `<div class="row s muted">Nichts eingetragen</div>`;
  }
  h += '</div></div>';
  const recs = Object.values(S.rc).filter(r => r.user_id === uid);
  h += `<div class="sec"><div class="sec-h"><h2>Mahlzeiten-Vorlagen</h2>${mine ? `<button class="btn sm" onclick="openRecipe()">Neue Vorlage</button>` : ''}</div>`;
  if (!recs.length) h += `<div class="note">${mine ? 'Vorlagen sind Mahlzeiten, die du öfter isst. Weise sie Wochentagen zu, dann erscheinen sie unter Heute zum Abhaken.' : 'Noch keine Vorlagen.'}</div>`;
  else h += '<div class="list">' + recs.map(r => { const t = recipeTotals(r, r.data.factor || 1);

  return h + '</div>';
}

let P = null;
async function openPicker(opts){
  P = { tab:'suche', results:[], lib:null, ...opts };
  drawPicker();
  P.lib = await loadLib(); if (P.tab === 'suche') showResults(P.lib.slice(0, 30), 'Eigene und zuletzt verwendete');

async function loadLib(){
  const ids = [S.user.id, S.partner?.id].filter(Boolean);
  const [foods, logs] = await Promise.all([ Promise.all(ids.map(id => q('food', id))).then(x => x.flat()), q('log', S.user.id, addDays(today(), -45), null) ]);
  const seen = new Set(), out = [];
  foods.forEach(f => { const k = f.data.name.toLowerCase(); if (!seen.has(k)){ seen.add(k); out.push({ ...f.data, src:'eigen' }); } });
  logs.reverse().forEach(l => { if (!l.data.per) return; const k = l.data.name.toLowerCase(); if (!seen.has(k)){ seen.add(k); out.push({ name:l.data.name, per:l.data.per, serving:l.data.grams, src:'zuletzt' }); } });
  return out;
}

  if (P.tab === 'scan') h += `<div id="reader"></div><p class="small muted">Halte den Barcode ruhig in den Rahmen. Alternativ die Nummer eintippen:</p><div class="searchrow"><input id="bc" inputmode="numeric" placeholder="Barcode-Nummer"><button class="btn" onclick="lookupCode($('#bc').value.trim())">Suchen</button></div><div id="scanmsg"></div>`;

      <div class="grid4">${[['ek','kcal'],['ep','Protein'],['ec','KH'],['ef','Fett']].map(([i, l]) => `<label class="f"><span>${l}</span><input id="${i}" inputmode="decimal"></label>`).join('')}</div>
      <label class="f"><span>Menge in g</span><input id="eg" inputmode="decimal" value="100"></label>

    if (P.mode === 'log') h += `<div class="sec"><h3 style="font-size:19px;margin-bottom:6px">Schnelleintrag</h3><p class="small muted" style="margin-top:0">Nur Gesamtwerte, z. B. für ein Restaurantessen.</p>
      <label class="f"><span>Bezeichnung</span><input id="qn" placeholder="z. B. Pizza beim Italiener"></label>
      <div class="grid4">${[['qk','kcal'],['qp','Protein'],['qc','KH'],['qf','Fett']].map(([i, l]) => `<label class="f"><span>${l}</span><input id="${i}" inputmode="decimal"></label>`).join('')}</div>
      <button class="btn full ghost" onclick="saveQuick()">Schnelleintrag speichern</button></div>`;

  openSheet(h);

function showResults(list, title){

function offMap(p){
  const n = p.nutriments || {};
  let kcal = num(n['energy-kcal_100g']); if (!kcal && n.energy_100g) kcal = num(n.energy_100g) / 4.184;
  if (!kcal) return null;
  return { name: p.product_name_de || p.product_name || 'Unbenanntes Produkt', brand: (p.brands || '').split(',')[0].trim(), barcode: p.code,
    per: { kcal, p: num(n.proteins_100g), c: num(n.carbohydrates_100g), f: num(n.fat_100g) }, serving: num(p.serving_quantity) || 0, src:'off' };
}
const OFF_FIELDS = 'code,product_name,product_name_de,brands,nutriments,serving_quantity';
async function doSearch(){

    const res = await fetch(url); if (!res.ok) throw new Error('Status ' + res.status);

/* ---------- Barcode-Scanner ---------- */
let scanner = null, scanBusy = false;
async function startScan(){
  const box = $('#reader');
  if (!window.Html5Qrcode){ box.outerHTML = '<div class="note">Der Scanner konnte nicht geladen werden. Tippe die Nummer unten ein.</div>'; return; }
  try {
    const F = Html5QrcodeSupportedFormats;
    scanner = new Html5Qrcode('reader', { formatsToSupport: [F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E], verbose: false });
    scanBusy = false;
    await scanner.start({ facingMode: 'environment' }, { fps: 10, qrbox: { width: 260, height: 130 } },
      code => { if (scanBusy) return; scanBusy = true; stopScan().then(() => lookupCode(code)); }, () => {});
  } catch (e) {
    scanner = null;
    box.outerHTML = `<div class="note">Die Kamera ist nicht verfügbar. Erlaube den Kamerazugriff für diese Seite (iPhone: Einstellungen, Safari, Kamera) oder tippe die Nummer unten ein.</div>`;
  }
}
async function stopScan(){ const s = scanner; scanner = null; if (s){ try { await s.stop(); s.clear(); } catch (e) {} } }
async function lookupCode(code){
  if (!code) return;
  const msg = $('#scanmsg'); if (msg) msg.innerHTML = `<p class="muted">Suche ${esc(code)} …</p>`;
  const lib = P.lib || await loadLib();
  const ownHit = lib.find(f => f.barcode === code);
  if (ownHit) return drawAmount(ownHit);
  try {
    const res = await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json?fields=${OFF_FIELDS}`);
    const js = await res.json();
    const food = js.status === 1 ? offMap({ ...js.product, code }) : null;
    if (food) return drawAmount(food);
    P.tab = 'eigen'; P.prefillCode = code; P.prefillName = js.product?.product_name || '';
    drawPicker(); toast('Produkt ohne Nährwerte gefunden. Bitte von der Verpackung eintragen.');
  } catch (e) {
    if ($('#scanmsg')) $('#scanmsg').innerHTML = '<p class="err">Open Food Facts ist gerade nicht erreichbar.</p>';
  }
}

  }
  h += `<div class="sec"><div class="sec-h"><h2>Verlauf</h2><span class="muted small">6 Wochen bis ${shortDate(S.day)}</span></div>`;
  h += wos.length ? wos.slice().reverse().map(w => {

      ${w.data.exercises.map(e => `<p><b>${esc(e.name)}</b>: ${e.sets.map(s => `${fmt1(num(s.kg)).replace(',0', '')}×${s.reps}`).join(', ')}</p>`).join('')}

let W = null;
async function lastMap(excludeId){

  ws.forEach(w => { if (w.id === excludeId) return; w.data.exercises.forEach(e => { if (e.sets.some(s => num(s.reps))) m[e.name.toLowerCase()] = { day: w.day, sets: e.sets }; }); });

}
const startWorkout = run(async rid => {
  const r = rid ? S.rt[rid] : null;
  W = { day: S.day, routine_id: rid || null, name: r ? r.data.name : 'Freies Training', note: '',
        exercises: r ? r.data.exercises.map(e => ({ name: e.name, target: e.reps, sets: Array.from({ length: e.sets }, () => ({ kg:'', reps:'' })) })) : [],

});
const editWorkout = run(async id => {
  const w = (await sb.from('entries').select('*').eq('id', id).single()).data;

function drawWorkout(){

      <div class="ex-h"><input value="${esc(e.name)}" placeholder="Übung" oninput="W.exercises[${i}].name=this.value"><button class="iconbtn" aria-label="Übung entfernen" onclick="W.exercises.splice(${i},1);drawWorkout()">×</button></div>
      <div class="last">${e.target ? 'Ziel: ' + esc(e.target) + ' Wdh. ' : ''}${esc(lastTxt(e.name))}</div>

        <input inputmode="decimal" aria-label="Gewicht in kg" placeholder="${ls ? esc(ls.kg) : 'kg'}" value="${esc(s.kg)}" oninput="W.exercises[${i}].sets[${j}].kg=this.value">
        <span class="muted">×</span>
        <input inputmode="numeric" aria-label="Wiederholungen" placeholder="${ls ? esc(ls.reps) : 'Wdh'}" value="${esc(s.reps)}" oninput="W.exercises[${i}].sets[${j}].reps=this.value">
        <button class="btn sm ghost" style="padding:4px" aria-label="Wie letztes Mal" ${ls ? '' : 'disabled'} onclick="copyLast(${i},${j})">=</button>
        <button class="iconbtn" aria-label="Satz entfernen" onclick="W.exercises[${i}].sets.splice(${j},1);drawWorkout()">×</button></div>`; }).join('')}
      <button class="btn sm ghost" onclick="addSet(${i})">+ Satz</button></div>`).join('')}
    <div class="btns" style="margin-top:0"><button class="btn sm line" onclick="W.exercises.push({name:'',sets:[{kg:'',reps:''}]});drawWorkout()">+ Übung</button></div>
    <label class="f" style="margin-top:14px"><span>Notiz</span><input value="${esc(W.note || '')}" oninput="W.note=this.value" placeholder="z. B. Schulter gezwickt, Schlaf schlecht"></label>

function copyLast(i, j){ const e = W.exercises[i]; const l = W.last[e.name.toLowerCase()]; const s = l && (l.sets[j] || l.sets.at(-1)); if (s){ e.sets[j] = { kg: s.kg, reps: s.reps }; drawWorkout(); } }
function addSet(i){ const s = W.exercises[i].sets; const prev = s.at(-1) || { kg:'', reps:'' }; s.push({ kg: prev.kg, reps: prev.reps }); drawWorkout(); }
const saveWorkout = run(async () => {

/* ================= Körper ================= */
const MEAS = [['taille','Taille'],['huefte','Hüfte'],['brust','Brust'],['arm','Oberarm'],['bein','Oberschenkel']];
function trend(ws){ // 7-Tage-Mittel je Eintrag
  return ws.map(w => { const win = ws.filter(x => x.day <= w.day && daysBetween(x.day, w.day) < 7); return { day: w.day, v: num(w.data.kg), avg: win.reduce((a, x) => a + num(x.data.kg), 0) / win.length }; });
}
function chart(pts){
  if (pts.length < 2) return '<div class="note">Ab zwei Einträgen erscheint hier der Verlauf.</div>';
  const Wd = 340, Ht = 160, L = 34, B = 20, T = 8, Rr = 8;
  const vals = pts.flatMap(p => [p.v, p.avg]); const lo = Math.floor(Math.min(...vals) - .3), hi = Math.ceil(Math.max(...vals) + .3);
  const span = Math.max(1, daysBetween(pts[0].day, pts.at(-1).day));
  const X = d => L + daysBetween(pts[0].day, d) / span * (Wd - L - Rr);
  const Y = v => T + (hi - v) / (hi - lo || 1) * (Ht - T - B);
  const line = pts.map(p => `${X(p.day).toFixed(1)},${Y(p.avg).toFixed(1)}`).join(' ');
  return `<div class="chart"><svg viewBox="0 0 ${Wd} ${Ht}" role="img" aria-label="Gewichtsverlauf">
    <g font-size="10" fill="var(--muted)" font-family="var(--fb)">
      <text x="2" y="${Y(hi) + 4}">${hi}</text><text x="2" y="${Y(lo) + 4}">${lo}</text>
      <text x="${L}" y="${Ht - 4}">${shortDate(pts[0].day)}</text><text x="${Wd - Rr}" y="${Ht - 4}" text-anchor="end">${shortDate(pts.at(-1).day)}</text></g>
    <line x1="${L}" x2="${Wd - Rr}" y1="${Y(hi)}" y2="${Y(hi)}" stroke="var(--line)"/><line x1="${L}" x2="${Wd - Rr}" y1="${Y(lo)}" y2="${Y(lo)}" stroke="var(--line)"/>
    ${pts.map(p => `<circle cx="${X(p.day).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="2.5" fill="var(--muted)" opacity=".55"/>`).join('')}
    <polyline points="${line}" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  </svg><div class="small muted">Punkte: Tageswerte. Linie: 7-Tage-Durchschnitt, der aussagekräftigere Wert.</div></div>`;
}
async function rKoerper(){
  const uid = viewId(), mine = own();
  const [ws, ms] = await Promise.all([ q('weight', uid, addDays(S.day, -120), S.day), q('measure', uid, null, S.day) ]);
  const tw = ws.find(w => w.day === S.day), tm = ms.find(m => m.day === S.day);
  const tr = trend(ws);
  let h = '';
  if (mine) h += `<div class="card"><label class="f" style="margin:0"><span>Gewicht ${dayLabel(S.day) === 'Heute' ? 'heute' : 'am ' + shortDate(S.day)} (morgens, nüchtern)</span>
    <div class="searchrow" style="margin:0"><input id="wkg" inputmode="decimal" placeholder="kg" value="${tw ? String(tw.data.kg).replace('.', ',') : ''}"><button class="btn" onclick="saveWeight('${tw?.id || ''}')">Speichern</button></div></label></div>`;
  h += `<div class="sec"><h2 style="margin-bottom:8px">Gewicht</h2>${chart(tr)}`;
  if (tr.length >= 2){
    const last = tr.at(-1);
    const ref = d => { const c = tr.filter(p => daysBetween(p.day, last.day) >= d); return c.length ? c.at(-1) : null; };
    const r7 = ref(7), r30 = ref(28);
    const dlt = r => r ? (last.avg - r.avg >= 0 ? '+' : '') + fmt1(last.avg - r.avg) : 'k. A.';
    h += `<div class="stats"><div><b>${fmt1(last.avg)}</b><span>Ø aktuell, kg</span></div><div><b>${dlt(r7)}</b><span>seit 7 Tagen</span></div><div><b>${dlt(r30)}</b><span>seit 4 Wochen</span></div></div>`;
  }
  h += '</div><div class="sec"><h2 style="margin-bottom:8px">Körpermaße</h2>';
  if (mine) h += `<div class="card"><p class="small muted" style="margin-top:0">In cm, z. B. alle zwei Wochen. Leere Felder werden übersprungen.</p><div class="grid2">${MEAS.map(([k, l]) => `<label class="f"><span>${l}</span><input id="m_${k}" inputmode="decimal" value="${tm?.data[k] ? String(tm.data[k]).replace('.', ',') : ''}"></label>`).join('')}</div>
    <button class="btn full" onclick="saveMeasure('${tm?.id || ''}')">Maße für ${shortDate(S.day)} speichern</button></div>`;
  if (ms.length){
    const first = k => ms.find(m => m.data[k]), latest = k => ms.slice().reverse().find(m => m.data[k]);
    h += `<div class="sec" style="margin-top:12px"><div style="overflow-x:auto"><table class="m"><thead><tr><th>Maß</th><th>Start</th><th>Aktuell</th><th>Differenz</th></tr></thead><tbody>${MEAS.map(([k, l]) => {
      const a = first(k), b = latest(k); if (!a) return '';
      const d = num(b.data[k]) - num(a.data[k]);
      return `<tr><td>${l}</td><td>${fmt1(a.data[k])}<div class="small muted">${shortDate(a.day)}</div></td><td>${fmt1(b.data[k])}<div class="small muted">${shortDate(b.day)}</div></td><td>${d > 0 ? '+' : ''}${fmt1(d)}</td></tr>`; }).join('')}</tbody></table></div></div>`;
  } else if (!mine) h += '<div class="note">Noch keine Maße eingetragen.</div>';
  return h + '</div>';
}

    <p class="small muted">Gib diesen Code an deinen Partner. Es reicht, wenn einer von euch den Code des anderen eingibt.</p>
    <div class="searchrow"><input id="pcode" placeholder="Code des Partners" autocapitalize="characters"><button class="btn" onclick="linkPartner()">Verknüpfen</button></div>`;
  h += `</div></div><div class="sec"><button class="btn line full" onclick="sb.auth.signOut()">Abmelden</button><p class="small muted">Angemeldet als ${esc(S.user.email)}</p></div>`;
  return h;
}
function readCalc(){
  const f = $('#calc'); if (!f) return null;
  const g = n => f.elements[n]?.value ?? '';
  return { sex: g('sex'), birthYear: num(g('birthYear')), height: num(g('height')), weight: num(g('weight')), bf: num(g('bf')) || null,
    steps: num(g('steps')), sessions: num(g('sessions')), sessionMin: num(g('sessionMin')), trainType: g('trainType'),
    trainDays: [...f.querySelectorAll('input[name=td]:checked')].map(x => +x.value), cycle: f.elements.cycle.checked,
    goal: g('goal'), rate: num(g('rate')), protein: num(g('protein')), fat: num(g('fat')), adaptiveTdee: S.me.data.adaptiveTdee || null };
}
function calcUpdate(){
  const d = readCalc(); if (!d) return;
  $('#ratef').style.display = ['cut','bulk'].includes(d.goal) ? '' : 'none';
  $('#ratel').textContent = d.goal === 'bulk' ? 'Zunahme in % Körpergewicht pro Monat' : 'Abnahme in % Körpergewicht pro Woche';
  const r = calc(d); const out = $('#calcres');
  if (!r.ok){ out.innerHTML = '<p class="muted" style="margin:0">Trag Geburtsjahr, Größe und Gewicht ein, dann erscheint hier die Berechnung.</p>'; return; }
  const sign = n => (n >= 0 ? '+' : '−') + fmt(Math.abs(n));
  const goalTxt = { cut: `Defizit (${fmt1(d.rate)} % pro Woche ≈ ${fmt1(d.rate / 100 * d.weight)} kg)`, bulk: `Überschuss (${fmt1(d.rate)} % pro Monat ≈ ${fmt1(d.rate / 100 * d.weight)} kg)`, recomp: 'Leichtes Defizit (5 %)', maintain: 'Keine Anpassung' }[d.goal];
  const box = (title, t) => `<div><span class="small muted">${title}</span><b>${fmt(t.kcal)}</b><span class="small">P ${t.p} g, KH ${t.c} g, F ${t.f} g</span></div>`;
  out.innerHTML = `
    <div class="calc-line"><span>Grundumsatz, ${r.method}</span><span>${fmt(r.bmr)} kcal</span></div>
    <div class="calc-line"><span>Alltag und Verdauung (Grundumsatz × 1,2)</span><span>${sign(r.base - r.bmr)} kcal</span></div>
    <div class="calc-line"><span>Zusätzliche Schritte über 3.000</span><span>${sign(r.stepsK)} kcal</span></div>
    <div class="calc-line"><span>Training pro Einheit, netto</span><span>${sign(r.sessionK)} kcal</span></div>
    <div class="calc-line"><span><b>Ø Verbrauch pro Tag${r.adaptive ? ', laut Formel' : ''}</b></span><span><b>${fmt(r.avgTdee)} kcal</b></span></div>
    ${r.adaptive ? `<div class="calc-line"><span><b>Gemessener Verbrauch (wird verwendet)</b></span><span><b>${fmt(r.adaptive)} kcal</b></span></div>` : ''}
    <div class="calc-line"><span>${goalTxt}</span><span>${sign(r.adj)} kcal</span></div>
    <div class="tgt">${r.targets.cycle ? box('Trainingstag', r.targets.train) + box('Ruhetag', r.targets.rest) : box('Tagesziel', r.targets.avg)}</div>
    ${r.warn.map(w => `<div class="warnbox">${esc(w)}</div>`).join('')}`;
}
const saveTargets = run(async () => {
  const d = readCalc(); const r = calc(d);
  if (!r.ok) return toast('Geburtsjahr, Größe und Gewicht fehlen');
  await saveProfile({ ...d, targets: r.targets }, $('#pname').value.trim() || S.me.display_name);
  toast('Ziele gespeichert');
});
async function runAdaptive(){
  const box = $('#adapt');
  const from = addDays(today(), -28), to = addDays(today(), -1);
  const [ws, logs] = await Promise.all([ q('weight', S.user.id, from, to), q('log', S.user.id, from, to) ]);
  const byDay = {}; logs.forEach(l => byDay[l.day] = (byDay[l.day] || 0) + num(l.data.kcal));
  const days = Object.keys(byDay).filter(k => byDay[k] > 600);
  const spanW = ws.length ? daysBetween(ws[0].day, ws.at(-1).day) : 0;
  if (ws.length < 6 || spanW < 13 || days.length < 10){
    box.innerHTML = `<p style="margin-top:0">Noch zu wenig Daten. Benötigt in den letzten 4 Wochen: mindestens 6 Gewichtseinträge über 2 Wochen verteilt (aktuell ${ws.length}, über ${spanW} Tage) und 10 vollständig geloggte Tage (aktuell ${days.length}).</p><button class="btn ghost" onclick="runAdaptive()">Erneut prüfen</button>`;
    return;
  }
  const xs = ws.map(w => daysBetween(from, w.day)), ys = ws.map(w => num(w.data.kg));
  const mx = xs.reduce((a, b) => a + b) / xs.length, my = ys.reduce((a, b) => a + b) / ys.length;
  const slope = xs.reduce((a, x, i) => a + (x - mx) * (ys[i] - my), 0) / (xs.reduce((a, x) => a + (x - mx) ** 2, 0) || 1);
  const avgIn = days.reduce((a, k) => a + byDay[k], 0) / days.length;
  const tdee = Math.round(avgIn - slope * 7700);
  const formula = calc(readCalc() || {}); 
  box.innerHTML = `<div class="calc-line"><span>Ø Aufnahme an ${days.length} geloggten Tagen</span><span>${fmt(avgIn)} kcal</span></div>
    <div class="calc-line"><span>Gewichtstrend</span><span>${slope * 7 >= 0 ? '+' : '−'}${fmt1(Math.abs(slope * 7))} kg pro Woche</span></div>
    <div class="calc-line"><span><b>Gemessener Verbrauch</b></span><span><b>${fmt(tdee)} kcal</b></span></div>
    ${formula.ok ? `<div class="calc-line"><span>Zum Vergleich laut Formel</span><span>${fmt(formula.avgTdee)} kcal</span></div>` : ''}
    <p class="small muted">Nur verlässlich, wenn an den geloggten Tagen wirklich alles erfasst wurde. Ungeloggte Tage werden ignoriert.</p>
    <div class="btns"><button class="btn" onclick="applyAdaptive(${tdee})">Als Basis übernehmen</button></div>`;
}
const applyAdaptive = run(async v => {
  const d = { ...(readCalc() || S.me.data), adaptiveTdee: v || null };
  const r = calc(d);
  await saveProfile({ adaptiveTdee: v || null, ...(r.ok ? { targets: r.targets } : {}) });
  toast(v ? 'Gemessener Verbrauch übernommen, Ziele aktualisiert' : 'Ziele basieren wieder auf der Formel');
  render();
});
const linkPartner = run(async () => {
  const code = $('#pcode').value.trim(); if (!code) return;
  const { error } = await sb.rpc('link_partner', { code }); if (error) throw error;
  await loadProfiles(); toast('Verknüpft mit ' + nameOf(S.partner)); render();
});
const unlinkPartner = run(async () => {
  if (!confirm('Verknüpfung wirklich lösen? Ihr seht dann gegenseitig nichts mehr. Eure Daten bleiben erhalten.')) return;
  const { error } = await sb.rpc('unlink_partner'); if (error) throw error;
  await loadProfiles(); render();
});

/* ================= Anmeldung & Start ================= */
function showAuth(msg = ''){
  document.body.classList.remove('in');
  $('#view').dataset.tab = '';
  $('#view').innerHTML = `<div class="auth"><div class="rings"><i></i><i></i></div><h1>Fit-Tracker</h1><p class="muted">Ernährung, Training und Fortschritt, gemeinsam im Blick.</p>
    <label class="f"><span>E-Mail</span><input id="ae" type="email" autocomplete="email"></label>
    <label class="f"><span>Passwort</span><input id="ap" type="password" autocomplete="current-password"></label>
    <label class="f" id="anf" style="display:none"><span>Dein Name</span><input id="an" autocomplete="given-name"></label>
    <div id="amsg" class="small ${msg ? 'err' : ''}">${esc(msg)}</div>
    <div class="btns"><button class="btn full" id="ab1" onclick="doLogin()">Anmelden</button>
    <button class="btn line full" id="ab2" onclick="toggleSignup()">Neues Konto erstellen</button></div></div>`;
}
let signup = false;
function toggleSignup(){
  signup = !signup;
  $('#anf').style.display = signup ? '' : 'none';
  $('#ab1').textContent = signup ? 'Konto erstellen' : 'Anmelden';
  $('#ab2').textContent = signup ? 'Ich habe schon ein Konto' : 'Neues Konto erstellen';
  $('#ap').autocomplete = signup ? 'new-password' : 'current-password';
}
async function doLogin(){
  const email = $('#ae').value.trim(), password = $('#ap').value, m = $('#amsg');
  if (!email || password.length < 6){ m.className = 'small err'; m.textContent = 'E-Mail und ein Passwort mit mindestens 6 Zeichen eingeben.'; return; }
  m.className = 'small muted'; m.textContent = 'Einen Moment …';
  const res = signup ? await sb.auth.signUp({ email, password, options: { data: { name: $('#an').value.trim() } } })
                     : await sb.auth.signInWithPassword({ email, password });
  if (res.error){ m.className = 'small err'; m.textContent = res.error.message === 'Invalid login credentials' ? 'E-Mail oder Passwort stimmt nicht.' : res.error.message; return; }
  if (!res.data.session){ m.className = 'small'; m.textContent = 'Fast geschafft: Bestätige deine E-Mail-Adresse über den Link in deinem Postfach und melde dich dann an.'; return; }
  S.user = res.data.session.user; boot();
}
async function boot(){
  try { await loadProfiles(); } catch (e) { showAuth('Profil konnte nicht geladen werden: ' + (e.message || e)); return; }
  document.body.classList.add('in'); render();
}
async function init(){
  if (!window.supabase || !cfg.SUPABASE_URL || cfg.SUPABASE_URL.includes('DEIN-PROJEKT')){
    $('#view').innerHTML = '<div class="auth"><h1>Fast fertig</h1><p>Trag in der Datei <b>config.js</b> die Supabase-Adresse und den Schlüssel ein. Die Anleitung erklärt, wo du beides findest.</p></div>';
    return;
  }
  sb = supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
  sb.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_OUT'){ S.user = null; S.me = null; S.partner = null; showAuth(); } });
  const { data: { session } } = await sb.auth.getSession();
  if (session){ S.user = session.user; boot(); } else showAuth();
}
$('#prev').onclick = () => { S.day = addDays(S.day, -1); render(); };
$('#next').onclick = () => { if (S.day < today()){ S.day = addDays(S.day, 1); render(); } };
$('#dayl').onclick = () => { S.day = today(); render(); };
$('#tabs').onclick = e => { const b = e.target.closest('button'); if (b){ S.tab = b.dataset.tab; render(); window.scrollTo(0, 0); } };
let lastSeen = today();
document.addEventListener('visibilitychange', () => {
  if (document.hidden || !S.user || sheetOpen() || S.tab === 'profil') return;
  if (today() !== lastSeen){ if (S.day === lastSeen) S.day = today(); lastSeen = today(); }
  loadProfiles().then(render).catch(() => {});
});
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
init();
</script>
