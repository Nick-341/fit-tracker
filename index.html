<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spotter</title>
<meta name="theme-color" content="#F2F3F0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Spotter">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<script>try{var t=localStorage.getItem('theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;}catch(e){}</script>
<style>
:root{
  --bg:#F2F3F0;--surface:#FFFFFF;--soft:#E6E8E4;--line:#DCDFDA;--ink:#15181C;--muted:#58606A;
  --accent:#FFB81C;--on-accent:#15181C;--mine:#C98200;--partner:#0A84C6;--warn:#C0341D;--ok:#1E8A4C;
  --board:#15181C;--board-soft:#2E343B;--partner-bg:#E3F1FA;--hint:#FFF1CC;--pad:#FFFFFF;--board-ink:#F2F3F0;--board-muted:#A2AAB2;
  --r-board:24px;--r-card:20px;--r-btn:14px;--r-sm:10px;
  --f:'Archivo',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15181C;--surface:#21252B;--soft:#30363E;--line:#30363E;--ink:#F2F3F0;--muted:#A2AAB2;
  --mine:#FFB81C;--partner:#5CC8FF;--warn:#FF8A7A;--ok:#5FD08E;--board:#0B0D10;--board-soft:#262B32;--partner-bg:#1C2E3A;--hint:#3A311C;--pad:#1B1F24;color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#15181C;--surface:#21252B;--soft:#30363E;--line:#30363E;--ink:#F2F3F0;--muted:#A2AAB2;
  --mine:#FFB81C;--partner:#5CC8FF;--warn:#FF8A7A;--ok:#5FD08E;--board:#0B0D10;--board-soft:#262B32;--partner-bg:#1C2E3A;--hint:#3A311C;--pad:#1B1F24;color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:16px/1.45 var(--f);-webkit-text-size-adjust:100%;min-height:100vh;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{font-weight:900;font-stretch:112%;margin:0;line-height:1.1}
h2{font-size:22px}h3{font-size:20px}
.muted{color:var(--muted)}.err{color:var(--warn)}.small{font-size:14px}
.pad{padding:16px}
.num{font-weight:900;font-stretch:90%;font-variant-numeric:tabular-nums}
/* Design-System 1.6: Anzeigetafel, Label, Zahlengrößen */
.board{background:var(--board);color:var(--board-ink);border-radius:var(--r-board);padding:20px;color-scheme:dark}
.board .muted,.board .lbl{color:var(--board-muted)}
.board .track{background:var(--board-soft)}
.board .track>i{background:var(--accent)}
.board .track.over>i{background:var(--warn)}
.board hr{border:0;border-top:1px solid var(--board-soft);margin:16px 0}
.lbl{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.n108{font-size:108px;line-height:.8}.n96{font-size:96px;line-height:.8}.n54{font-size:54px;line-height:.8}
.n44{font-size:44px;line-height:.8}.n40{font-size:40px;line-height:.8}.n36{font-size:36px;line-height:.9}
.n28{font-size:28px;line-height:1}.n24{font-size:24px;line-height:1}.n20{font-size:20px;line-height:1.1}
.unit{font-size:15px;font-weight:600;font-stretch:100%;color:var(--muted);margin-left:2px}
.board .unit{color:var(--board-muted)}
.track.t10{height:10px;border-radius:5px}.track.t10>i{border-radius:5px}
.track.t4{height:4px;border-radius:2px;margin-top:8px}.track.t4>i{border-radius:2px}
.hintbar{background:var(--hint);border-radius:var(--r-card);padding:12px 16px;font-size:14px;display:flex;flex-direction:column;gap:8px}

/* Kopfzeile */
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top,0px) + 6px) 16px 8px}
.top-in{max-width:560px;margin:0 auto;display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.daynav{display:flex;align-items:center;margin-left:-12px}
.daynav button{white-space:nowrap;background:none;border:0;color:var(--ink);min-height:44px;min-width:44px;padding:0 8px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center}
#dayl{font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.daynav button:disabled{opacity:.3}
#ttl{font-size:44px;line-height:1}
.lvl{display:flex;align-items:center;gap:8px;background:var(--surface);border:0;border-radius:999px;padding:6px 14px 6px 6px;font-weight:700;font-size:13px;min-height:44px;white-space:nowrap}
.lvl .lb{width:32px;height:32px;border-radius:16px;background:var(--accent);color:var(--on-accent);font-weight:900;font-size:15px;display:flex;align-items:center;justify-content:center}
.lvl.empty{visibility:hidden}
.who-wrap{max-width:560px;margin:10px auto 0}
.who-wrap:empty{display:none}
.who,.seg{display:flex;background:var(--surface);border-radius:14px;padding:4px;gap:4px}
.who button,.seg button{flex:1;border:0;background:none;min-height:38px;padding:0 10px;border-radius:10px;font-weight:700;font-size:14px;color:var(--muted);white-space:nowrap}
.who button.on,.seg button.on{background:var(--ink);color:var(--bg)}
.seg{margin-bottom:14px;overflow-x:auto}

main{max-width:560px;margin:0 auto;padding:8px 16px calc(120px + env(safe-area-inset-bottom,0px))}

/* Untere Navigation */
.tabs{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);z-index:5}
.tabs-in{max-width:536px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-radius:22px;padding:6px;gap:2px;box-shadow:0 8px 28px rgba(0,0,0,.14)}
.tabs button{border:0;background:none;min-height:52px;border-radius:16px;font-weight:700;font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:4px 0}
.tabs button svg{flex:none}
.tabs button.on{background:var(--accent);color:var(--on-accent);font-weight:800}
body:not(.in) .top,body:not(.in) .tabs{display:none}

/* Heute */
.bhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.bhead>.small{text-align:right}
.bnum{margin:16px 0 20px;letter-spacing:-.01em}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.macros>div>div:nth-child(2){white-space:nowrap}
.macros .unit{font-size:13px}
.pboard .track>i{background:var(--partner)}
.week{margin-top:12px}
.wgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:12px}
.wcol{border:0;background:none;border-radius:var(--r-btn);padding:8px 0;display:flex;flex-direction:column;align-items:center;gap:8px;color:inherit}
.wcol:disabled{cursor:default}
.wcol.today{background:var(--soft)}
.wdot{display:block;width:14px;height:14px;border-radius:7px;border:2px solid var(--soft)}
.wcol.today .wdot.me{border-color:var(--accent)}.wcol.today .wdot.pa{border-color:var(--partner)}
.wdot.me.on{background:var(--accent);border-color:var(--accent)}.wdot.pa.on{background:var(--partner);border-color:var(--partner)}
.pline{display:flex;align-items:center;gap:8px;width:100%;border:0;border-top:1px solid var(--line);background:none;color:inherit;padding:12px 0 0;margin-top:12px;font-size:13px;text-align:left;min-height:44px}
.pline .muted{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pdot{width:10px;height:10px;border-radius:5px;background:var(--partner);flex:none}
.chev{color:var(--muted);display:flex;flex:none}
.tname{font-weight:900;font-stretch:112%;font-size:22px;line-height:1.1;margin-top:4px;overflow-wrap:anywhere}
.tile .btn{margin-top:auto}
.tile .s{margin-bottom:12px}
.tile .trend{margin:auto 0 0;padding-top:12px;display:flex;align-items:center;gap:4px}
.tile.done .lbl{color:var(--on-accent);opacity:.8}
button.row{width:100%;border:0;border-bottom:1px solid var(--line);background:none;color:inherit;text-align:left;min-height:60px}
button.row:last-child{border-bottom:0}
.hintbar .hrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hintbar .sharein .grow{flex:1 1 calc(100% - 24px)}
.hintbar .sharein .btn{margin-left:18px}
.hintbar .kudosin svg{color:var(--mine)}
.hintbar .kudosin,.hintbar .sharein{background:none;color:inherit;padding:0;margin:0;border-radius:0}
.hintbar .sharein .btn{background:var(--ink);color:var(--bg)}
.hintbar .grow{flex:1;min-width:0}
.hero{background:var(--surface);border-radius:24px;padding:18px;display:flex;gap:16px;align-items:center}
.hero svg{flex:none}
.mb{flex:1;display:flex;flex-direction:column;gap:10px;min-width:0}
.mb .l{display:flex;justify-content:space-between;font-size:13px;font-weight:700;gap:6px;white-space:nowrap}
.track{height:8px;background:var(--soft);border-radius:4px;overflow:hidden;margin-top:4px}
.track>i{display:block;height:100%;background:var(--ink);border-radius:4px}
.track.over>i{background:var(--warn)}
.track.c>i{background:var(--c)}
.subline{font-size:13px;color:var(--muted);font-weight:600;margin:8px 4px 0}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.tile{background:var(--surface);border-radius:var(--r-card);padding:16px;border:0;text-align:left;width:100%;display:flex;flex-direction:column;color:inherit}
.tile .k{font-size:12px;font-weight:700;color:var(--muted)}
.tile .v{font-weight:900;font-size:21px;line-height:1.15;margin-top:4px;overflow-wrap:break-word;hyphens:auto}
.tile .s{font-size:13px;font-weight:600;color:var(--muted);margin-top:4px}
.tile.done{background:var(--accent);color:var(--on-accent)}
.tile.done .k,.tile.done .s{color:var(--on-accent);opacity:.8}
.prow{background:var(--surface);border-radius:20px;padding:12px 14px;display:flex;align-items:center;gap:12px;margin-top:12px;border:0;width:100%;text-align:left}
.pl{width:42px;height:42px;border-radius:21px;border:3px solid var(--partner);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px;flex:none}
.pexp{margin-top:8px}
.pexp .hero{border:2px solid var(--partner)}

/* Essen */
.eboard{display:flex;gap:16px;align-items:flex-end;padding:16px 20px}
.emac{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;min-width:0}
.emac .unit{font-size:12px}
.meals{margin-top:12px}
.meal{border-bottom:1px solid var(--line)}
.meal:last-child{border-bottom:0}
.mrow{display:flex;align-items:center;gap:8px;padding:0 12px 0 0;min-height:72px}
.meal.empty .mrow{min-height:56px}
.mhead{flex:1;min-width:0;display:flex;align-items:center;gap:12px;border:0;background:none;color:inherit;text-align:left;padding:12px 0 12px 16px;align-self:stretch}
.mhead .grow{flex:1;min-width:0;display:flex;flex-direction:column}
.mname{font-size:17px;font-weight:900;font-stretch:112%;line-height:1.2}
.meal.empty .mname{color:var(--muted)}
.mitems{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mk{display:flex;flex-direction:column;align-items:flex-end;flex:none}
.mk span{font-size:13px;color:var(--muted);margin-top:4px}
.mplus{flex:none;width:44px;height:44px;border-radius:var(--r-btn);border:0;background:var(--soft);color:var(--ink);display:flex;align-items:center;justify-content:center}
.mexp{margin:0 12px 12px;background:var(--bg);border-radius:var(--r-btn);padding:4px 0;overflow:hidden}
.mexp .row{border-bottom:0;padding:8px 12px}
.mexp .btns{padding:0 12px}
.mshare{display:flex;align-items:center;gap:8px;margin:0 12px 12px;background:var(--partner-bg);border-radius:var(--r-btn);padding:12px;font-size:14px}
.mshare .grow{flex:1;min-width:0}
.mshare .btn{background:var(--surface);color:var(--ink)}
.fbar{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 84px);z-index:4;display:flex;gap:8px;max-width:528px;margin:0 auto}
.fsearch{flex:1;display:flex;align-items:center;gap:12px;min-height:52px;border:2px solid var(--line);border-radius:var(--r-card);background:var(--surface);color:var(--muted);font-weight:600;padding:0 16px;box-shadow:0 8px 24px rgba(0,0,0,.12);text-align:left}
.fscan{flex:none;width:52px;height:52px;border:0;border-radius:var(--r-card);background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(0,0,0,.12)}
body.fixbar main{padding-bottom:calc(190px + env(safe-area-inset-bottom,0px))}

/* Abschnitte & Listen */
.sec{margin:24px 0 8px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px}
.list{background:var(--surface);border-radius:var(--r-card);overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:700;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:13px;color:var(--muted)}
.row .k{font-weight:800;white-space:nowrap}
.row.tap{cursor:pointer}
.row.dim .t{text-decoration:line-through;color:var(--muted)}
.note{background:var(--surface);border-radius:var(--r-card);padding:12px 16px;color:var(--muted);font-size:15px}
.slot-h{display:flex;justify-content:space-between;padding:10px 14px;background:var(--soft);font-weight:800;font-size:13px}
.card{background:var(--surface);border-radius:var(--r-card);padding:16px}
.big{font-weight:900;font-stretch:90%;font-size:52px;line-height:1;margin:2px 0}
.big small{font-size:18px;font-weight:700;font-stretch:100%;color:var(--muted);margin-left:6px}

/* Buttons & Formulare */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:var(--r-btn);padding:8px 16px;font-weight:800;background:var(--ink);color:var(--bg);min-height:44px}
.btn.accent{background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.line{background:none;border:2px solid var(--line);color:var(--ink)}
.btn.danger{background:none;color:var(--warn);border:2px solid var(--line)}
.btn.sm{padding:4px 12px;min-height:36px;font-size:14px;border-radius:var(--r-sm)}
.btn.full{width:100%}
.btn.done{background:var(--soft);color:var(--ok)}
.iconbtn{border:0;background:none;color:var(--muted);font-size:22px;line-height:1;padding:6px 8px;border-radius:8px;min-width:36px;min-height:36px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.f{display:block;margin-bottom:12px}
.f>span{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:4px}
input,select,textarea{width:100%;background:var(--surface);border:2px solid var(--line);border-radius:var(--r-btn);padding:8px 12px;min-height:46px;font-size:16px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:0}
textarea{min-height:120px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:0 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip span{display:inline-flex;align-items:center;min-height:38px;padding:0 14px;border-radius:999px;background:var(--surface);font-weight:700;font-size:14px;cursor:pointer}
.chip input:checked+span{background:var(--accent);color:var(--on-accent)}
.chip input:focus-visible+span{outline:3px solid var(--accent)}
.check{display:flex;gap:10px;align-items:center;margin-bottom:12px;font-weight:600}
.check input{width:22px;height:22px;min-height:0;accent-color:var(--accent)}

/* Rechner */
.calc-out{background:var(--surface);border-radius:22px;padding:16px 18px;margin-top:4px}
.calc-line{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:15px}
.calc-line:last-child{border-bottom:0}
.calc-line span:first-child{color:var(--muted)}
.tgt{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:12px}
.tgt div{background:var(--accent);color:var(--on-accent);border-radius:16px;padding:12px 14px}
.tgt b{font-weight:900;font-stretch:90%;font-size:32px;display:block;line-height:1.1}
.warnbox{margin-top:10px;color:var(--warn);font-size:14px;font-weight:600}

/* Bottom Sheet */
.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet.hidden{display:none}
.sheet-bg{position:absolute;inset:0;background:rgba(8,10,12,.55)}
.sheet-card{position:relative;background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet-card{animation:none}}
.sh-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:8px}
#reader{width:100%;border-radius:16px;overflow:hidden;background:#000;min-height:220px}
.searchrow{display:flex;gap:8px;margin-bottom:12px}
.searchrow input{flex:1}
.quick{display:flex;gap:6px;margin:-4px 0 12px}
.quick button{flex:1}

/* Training */
.ex{background:var(--surface);border-radius:20px;padding:12px 14px;margin-bottom:10px}
.ex-h{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.ex-h input{font-weight:800}
.last{font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:600}
.setrow{display:grid;grid-template-columns:26px 1fr 14px 1fr 40px 32px;gap:6px;align-items:center;margin-bottom:6px}
.setrow .n{color:var(--muted);font-weight:800;text-align:center}
.setrow input{text-align:center;padding:8px 4px;font-weight:700}
details.wo{background:var(--surface);border-radius:20px;margin-bottom:8px}
details.wo summary{padding:14px 16px;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:8px}
details.wo summary::-webkit-details-marker{display:none}
details.wo .body{padding:0 16px 14px;font-size:15px}
details.wo .body p{margin:4px 0}
.pr{display:inline-block;background:var(--accent);color:var(--on-accent);font-size:11px;font-weight:800;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px}

/* Körper */
.chart{background:var(--surface);border-radius:20px;padding:12px;color:var(--c,var(--mine))}
.chart svg{width:100%;height:auto;display:block}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.stats div{background:var(--surface);border-radius:16px;padding:10px 12px}
.stats b{font-weight:900;font-stretch:90%;font-size:26px;display:block;line-height:1.1}
.stats span{font-size:12px;font-weight:600;color:var(--muted)}
table.m{width:100%;border-collapse:collapse;background:var(--surface);border-radius:20px;overflow:hidden;font-size:15px}
table.m th,table.m td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line)}
table.m th:first-child,table.m td:first-child{text-align:left}
table.m th{font-weight:700;color:var(--muted);font-size:13px}

/* Level & Abzeichen */
.lvlhero{background:var(--accent);color:var(--on-accent);border-radius:24px;padding:20px}
.lvlhero .row1{display:flex;align-items:center;gap:14px}
.lvlbox{width:64px;height:64px;border-radius:18px;background:var(--on-accent);color:var(--accent);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none}
.lvlbox small{font-size:11px;font-weight:700}
.lvlbox b{font-weight:900;font-stretch:90%;font-size:30px;line-height:1}

/* Login */
.auth{max-width:420px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 48px) 20px 40px}

#toast.show{opacity:1}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" integrity="sha384-0w2KAL2YHP6wKOkUDzkCDGgVvfmHnj02DHeQ6XcHOgTfFsGyonKOpShMH1x6nk9o" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js" integrity="sha384-c9d8RFSL+u3exBOJ4Yp3HUJXS4znl9f+z66d1y54ig+ea249SpqR+w1wyvXz/lk+" crossorigin="anonymous"></script>
<script>
/* ================= Hilfsfunktionen ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const x = parseFloat(String(v ?? '').replace(',', '.')); return isFinite(x) ? x : 0; };
const r0 = n => Math.round(+n || 0);
const r1 = n => Math.round((+n || 0) * 10) / 10;
const fmt = n => r0(n).toLocaleString('de-DE');
const fmt1 = n => r1(n).toLocaleString('de-DE', {minimumFractionDigits: 1, maximumFractionDigits: 1});
const z = n => String(n).padStart(2, '0');
const ds = d => `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`;
const today = () => ds(new Date());
const addDays = (s, n) => { const d = new Date(s + 'T12:00:00'); d.setDate(d.getDate() + n); return ds(d); };
const daysBetween = (a, b) => Math.round((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 864e5);
const wd = s => (new Date(s + 'T12:00:00').getDay() + 6) % 7; // 0 = Montag
const WD = ['Mo','Di','Mi','Do','Fr','Sa','So'];
const SLOTS = [['fruehstueck','Frühstück'],['mittag','Mittagessen'],['abend','Abendessen'],['snack','Snacks']];
const slotName = k => (SLOTS.find(s => s[0] === k) || [0,'Sonstiges'])[1];
const shortDate = s => new Date(s + 'T12:00:00').toLocaleDateString('de-DE', {day:'numeric', month:'numeric'});
// Selbst zusammensetzen: Safari und Chrome formatieren toLocaleDateString unterschiedlich (Kommas, Punkte).
const MON = ['Jan.','Feb.','März','Apr.','Mai','Juni','Juli','Aug.','Sept.','Okt.','Nov.','Dez.'];
function dateParts(s){
  const d = new Date(s + 'T12:00:00');
  return { wd: WD[wd(s)] + '.', dm: d.getDate() + '. ' + MON[d.getMonth()] };
}
function dayLabel(s){
  if (s === today()) return 'Heute';
  if (s === addDays(today(), -1)) return 'Gestern';
  const p = dateParts(s); return p.wd + ', ' + p.dm;
}
let toastT;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2400); }
const scale = (per, g) => { const k = (+g || 0) / 100; return {kcal: per.kcal*k, p: per.p*k, c: per.c*k, f: per.f*k}; };
const addN = (a, b) => ({kcal: a.kcal + (+b.kcal||0), p: a.p + (+b.p||0), c: a.c + (+b.c||0), f: a.f + (+b.f||0)});
const ZERO = {kcal:0, p:0, c:0, f:0};
const sum = logs => logs.reduce((a, l) => addN(a, l.data), ZERO);
const roundN = v => ({kcal: r0(v.kcal), p: r1(v.p), c: r1(v.c), f: r1(v.f)});
const recipeTotals = (r, factor = 1) => (r.items || r.data?.items || []).reduce((a, i) => addN(a, scale(i.per, i.grams * factor)), ZERO); // Vorlage als Eintrag oder als Daten

/* ================= Supabase & Zustand ================= */
const cfg = window.APP_CONFIG || {};
let sb = null;
const S = { user:null, me:null, partner:null, who:'me', day: today(), tab:'heute', rc:{}, rt:{} };
const viewId = () => (S.who === 'partner' && S.partner) ? S.partner.id : S.user.id;
const own = () => viewId() === S.user.id;
const nameOf = p => p?.display_name || 'Partner';

/* ---------- Offline-Schicht: Lese-Cache und Warteschlange ---------- */
const NET_ERR = e => !navigator.onLine || /fetch|network|load failed|offline|timed? ?out/i.test(e?.message || String(e || ''));
const LSJ = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };
const LSS = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } };
let QUEUE = LSJ('spotter:queue', []);
const saveQueue = () => { LSS('spotter:queue', QUEUE); netUI(); };
function cacheSet(key, rows){
  const c = LSJ('spotter:qc', { keys: [], data: {} });
  c.keys = c.keys.filter(k => k !== key); c.keys.push(key); c.data[key] = rows;
  while (c.keys.length > 150) delete c.data[c.keys.shift()];
  if (!LSS('spotter:qc', c)){ c.keys.slice(0, 75).forEach(k => delete c.data[k]); c.keys = c.keys.slice(75); LSS('spotter:qc', c); }
}
const cacheGet = key => LSJ('spotter:qc', { data: {} }).data[key];
function setOnline(on){ if (S.offline === !on) return; S.offline = !on; netUI(); if (on) syncQueue(); }
function netUI(){
  const el = $('#net'); if (!el) return;
  const n = QUEUE.filter(o => o.op !== 'profile').length;
  if (S.syncing) el.innerHTML = `<div class="netbar">Synchronisiere …</div>`;
  else if (S.offline) el.innerHTML = `<div class="netbar off">Offline${n ? `. ${n} ${n === 1 ? 'Eintrag wartet' : 'Einträge warten'} auf Upload` : '. Neue Einträge werden später hochgeladen'}</div>`;
  else if (n) el.innerHTML = `<button class="netbar" onclick="syncQueue()">${n} ${n === 1 ? 'Eintrag wartet' : 'Einträge warten'} auf Upload. Jetzt senden</button>`;
  else el.innerHTML = '';
}
function applyQueue(rows, kind, uid, from, to){
  if (uid !== S.user?.id || !QUEUE.length) return rows;
  let out = rows.slice();
  for (const o of QUEUE){
    if (o.op === 'insert' && o.kind === kind && (!from || (o.day && o.day >= from)) && (!to || (o.day && o.day <= to)) && (from || to || true))
      out.push({ id: o.tid, user_id: uid, kind, day: o.day, data: o.data, created_at: o.at, pending: true });
    if (o.op === 'update'){ const r = out.find(x => x.id === o.id); if (r){ r.data = o.data; if (o.day !== undefined) r.day = o.day; r.pending = true; } }
    if (o.op === 'delete') out = out.filter(x => x.id !== o.id);
  }
  if ((from || to)) out = out.filter(r => (!from || r.day >= from) && (!to || r.day <= to));
  return out;
}
async function q(kind, uid, from, to){
  const key = [kind, uid, from || '', to || ''].join('|');
  let rows;
  try {
    let r = sb.from('entries').select('*').eq('user_id', uid).eq('kind', kind);
    if (from) r = r.gte('day', from);
    if (to) r = r.lte('day', to);
    const { data, error } = await r.order('day', {ascending:true, nullsFirst:true}).order('created_at');
    if (error) throw error;
    rows = data || []; cacheSet(key, rows); setOnline(true);
  } catch (e) {
    if (!NET_ERR(e)) throw e;
    setOnline(false); rows = cacheGet(key) || [];
  }
  return applyQueue(rows, kind, uid, from, to);
}
const tmpId = () => 'tmp-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
function enqueue(o){ QUEUE.push({ ...o, at: new Date().toISOString() }); saveQueue(); setOnline(false); }
async function add(kind, day, data){
  invalidateMe();
  try {
    if (!navigator.onLine) throw new Error('offline');
    const { data: row, error } = await sb.from('entries').insert({ kind, day, data }).select().single();
    if (error) throw error; return row;
  } catch (e) {
    if (!NET_ERR(e)) throw e;
    const tid = tmpId(); enqueue({ op: 'insert', tid, kind, day, data });
    return { id: tid, user_id: S.user.id, kind, day, data, pending: true };
  }
}
async function addMany(kind, rows){
  invalidateMe();
  try {
    if (!navigator.onLine) throw new Error('offline');
    const { error } = await sb.from('entries').insert(rows.map(r => ({ kind, day: r.day, data: r.data })));
    if (error) throw error;
  } catch (e) {
    if (!NET_ERR(e)) throw e;
    rows.forEach(r => enqueue({ op: 'insert', tid: tmpId(), kind, day: r.day, data: r.data }));
  }
}
async function upd(id, data, day){
  invalidateMe();
  const qi = QUEUE.find(o => o.op === 'insert' && o.tid === id);
  if (qi){ qi.data = data; if (day !== undefined) qi.day = day; saveQueue(); return; }
  try {
    if (!navigator.onLine) throw new Error('offline');
    const patch = { data }; if (day !== undefined) patch.day = day;
    const { error } = await sb.from('entries').update(patch).eq('id', id);
    if (error) throw error;
  } catch (e) { if (!NET_ERR(e)) throw e; enqueue({ op: 'update', id, data, day }); }
}
async function del(id){
  invalidateMe();
  const i = QUEUE.findIndex(o => o.op === 'insert' && o.tid === id);
  if (i >= 0){ QUEUE.splice(i, 1); saveQueue(); return; }
  try {
    if (!navigator.onLine) throw new Error('offline');
    const { error } = await sb.from('entries').delete().eq('id', id);
    if (error) throw error;
  } catch (e) { if (!NET_ERR(e)) throw e; enqueue({ op: 'delete', id }); }
}
async function syncQueue(){
  if (S.syncing || !QUEUE.length || !S.user || !navigator.onLine) return;
  S.syncing = true; netUI();
  let done = 0, failed = 0;
  try {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) throw new Error('Keine Sitzung');
    while (QUEUE.length){
      const o = QUEUE[0]; let res;
      if (o.op === 'insert') res = await sb.from('entries').insert({ kind: o.kind, day: o.day, data: o.data });
      else if (o.op === 'update'){ const patch = { data: o.data }; if (o.day !== undefined) patch.day = o.day; res = await sb.from('entries').update(patch).eq('id', o.id); }
      else if (o.op === 'delete') res = await sb.from('entries').delete().eq('id', o.id);
      else if (o.op === 'profile') res = await sb.from('profiles').update({ data: S.me.data, display_name: S.me.display_name, updated_at: new Date().toISOString() }).eq('id', S.user.id);
      if (res?.error){ if (NET_ERR(res.error)) throw res.error; failed++; }
      else done++;
      QUEUE.shift(); saveQueue();
    }
    S.offline = false;
  } catch (e) { if (NET_ERR(e)) S.offline = true; }

/* ================= Kalorienrechner ================= */
const TRAIN_TYPES = {
  kraft:       ['Krafttraining, moderat', 3.5],
  kraft_hart:  ['Krafttraining, intensiv', 5],
  mix:         ['Kraft + Ausdauer gemischt', 5.5],
  cardio:      ['Ausdauer, moderat', 7],
  cardio_hart: ['Ausdauer, intensiv', 10]
};
function calc(d){
  const w = num(d.weight), h = num(d.height), age = new Date().getFullYear() - num(d.birthYear), bf = num(d.bf);
  if (!w || !h || !num(d.birthYear)) return { ok:false };
  let bmr, method;
  if (bf > 3 && bf < 60){ bmr = 370 + 21.6 * w * (1 - bf/100); method = 'Katch-McArdle (mit Körperfett)'; }
  else { bmr = 10*w + 6.25*h - 5*age + (d.sex === 'm' ? 5 : -161); method = 'Mifflin-St Jeor'; }
  const base = bmr * 1.2;                                        // Grundumsatz + leichter Alltag + Verdauung
  const stepsK = Math.max(0, num(d.steps) - 3000) * 0.0005 * w;  // zusätzliche Schritte
  const restTdee = base + stepsK;
  const met = (TRAIN_TYPES[d.trainType] || TRAIN_TYPES.kraft)[1];
  const sessionK = (met - 1) * w * (num(d.sessionMin) / 60);     // Netto-Mehrverbrauch pro Einheit
  const sessions = num(d.sessions);
  const avgTdee = restTdee + sessionK * sessions / 7;
  const warn = [];
  let adj = 0;
  if (d.goal === 'cut')    adj = -(num(d.rate) / 100 * w * 7700 / 7);
  if (d.goal === 'bulk')   adj =  (num(d.rate) / 100 * w * 7700 / 30.4);
  if (d.goal === 'recomp') adj = -0.05 * avgTdee;
  if (d.goal === 'cut' && -adj > avgTdee * 0.25){ adj = -avgTdee * 0.25; warn.push('Das Defizit wurde auf 25 % deines Verbrauchs begrenzt. Ein langsameres Tempo schützt Muskulatur und Leistung.'); }
  const adaptive = num(d.adaptiveTdee);
  const factor = adaptive ? adaptive / avgTdee : 1;
  const pG = num(d.protein) * w, fG = num(d.fat) * w;
  const mk = kcal => {
    const c = (kcal - pG*4 - fG*9) / 4;
    if (c < 50) warn.push('Bei diesen Werten bleiben kaum Kohlenhydrate übrig. Prüfe Protein und Fett.');
    return { kcal: r0(kcal), p: r0(pG), f: r0(fG), c: r0(Math.max(0, c)) };
  };
  const cycle = !!d.cycle && sessions > 0;
  const targets = {
    cycle, trainDays: d.trainDays || [],
    avg:   mk(avgTdee * factor + adj),
    rest:  mk(restTdee * factor + adj),
    train: mk((restTdee + sessionK) * factor + adj)
  };
  if (pG && num(d.protein) > 2.5) warn.push('Mehr als 2,5 g Protein pro kg bringt in der Regel keinen Zusatznutzen.');
  return { ok:true, bmr, method, base, stepsK, restTdee, sessionK, avgTdee, adj, factor, adaptive, targets, warn:[...new Set(warn)] };
}
function targetFor(p, day, trained){
  const t = p?.data?.targets; if (!t) return null;
  if (!t.cycle) return t.avg;
  return (trained || (t.trainDays || []).includes(wd(day))) ? t.train : t.rest;
}

function weekStrip(W7){
  const ws = addDays(S.day, -wd(S.day)), td = today();
  const days = Array.from({ length: 7 }, (_, i) => addDays(ws, i));
  const stat = (who, d) => { if (!who) return null; const logs = who.logs.filter(l => l.day === d);
    return inTarget(who.p, d, sum(logs).kcal, who.wos.some(w => w.day === d)); };
  let both = 0, mineN = 0;
  const cols = days.map((d, i) => {
    const a = stat(W7.me, d), b = stat(W7.pa, d); if (a) mineN++; if (a && b) both++;
    const dot = (on, cls) => `<i class="wdot ${cls} ${on ? 'on' : ''}"></i>`;
    const nm = W7.pa ? esc(nameOf(W7.pa.p)) : '';
    return `<button class="wcol ${d === td ? 'today' : ''}" ${d > td ? 'disabled' : `onclick="S.day='${d}';render()"`} aria-label="${WD[i]}: du ${a ? 'im Ziel' : 'nicht im Ziel'}${W7.pa ? `, ${nm} ${b ? 'im Ziel' : 'nicht im Ziel'}` : ''}">
      <span class="lbl">${WD[i]}</span>${dot(a, 'me')}${W7.pa ? dot(b, 'pa') : ''}</button>`;
  }).join('');
  return `<div class="card week"><div class="bhead"><h3>Diese Woche</h3><span class="small muted">${W7.pa ? `${both} ${both === 1 ? 'Tag' : 'Tage'} beide im Ziel` : `${mineN} ${mineN === 1 ? 'Tag' : 'Tage'} im Ziel`}</span></div>

const LEVEL_TITLES = [[1,'Einsteiger'],[3,'Stammgast'],[6,'Eisenfreund'],[10,'Routinier'],[15,'Athlet'],[20,'Maschine'],[30,'Legende']];
const xpNeed = L => 100 + 50 * (L - 1);
function levelOf(xp){
  let L = 1, rest = xp;
  while (rest >= xpNeed(L)){ rest -= xpNeed(L); L++; }
  return { level: L, into: rest, need: xpNeed(L), title: LEVEL_TITLES.filter(t => L >= t[0]).at(-1)[1] };
}
async function qPaged(kind, uid){

    const { data, error } = await sb.from('entries').select('day,data').eq('user_id', uid).eq('kind', kind)
      .order('day', { ascending:true, nullsFirst:true }).order('created_at').range(from, from + 999);

    if (d.wo) parts.push([d.wo > 1 ? '2 Trainingseinheiten' : 'Training absolviert', Math.min(d.wo, 2) * 30]);
    if (d.pr) parts.push([d.pr === 1 ? 'Neuer Bestwert' : d.pr + ' neue Bestwerte', d.pr * 15]);

    ['10 Einheiten', 'Trainings absolviert', wos.length, 10, 'db'], ['50 Einheiten', 'Trainings absolviert', wos.length, 50, 'db'],
    ['100 Einheiten', 'Trainings absolviert', wos.length, 100, 'db'], ['250 Einheiten', 'Trainings absolviert', wos.length, 250, 'db'],
    ['10 Bestwerte', 'Neue Bestleistungen', prs, 10, 'up'], ['50 Bestwerte', 'Neue Bestleistungen', prs, 50, 'up'],
    ['Protein-Profi', '30 Tage Proteinziel', protein, 30, 'star'], ['Punktlandung', '20 Tage im Kalorienziel', inRange, 20, 'target'],
    ['Waage-Routine', '30 Gewichtseinträge', ws.length, 30, 'scale']

/* ================= Übungsfortschritt ================= */
let EXP = null;
const e1rm = s => num(s.kg) * (1 + num(s.reps) / 30);
const openProgress = run(async () => {
  const uid = viewId();
  openSheet('<p class="muted">Lädt …</p>');
  const wos = await qPaged('workout', uid);
  const map = {};
  wos.forEach(w => (w.data.exercises || []).forEach(e => {
    const k = e.name.toLowerCase().trim(); if (!k) return;
    const best = e.sets.reduce((a, s) => e1rm(s) > e1rm(a) ? s : a, e.sets[0] || { kg: 0, reps: 0 });
    (map[k] = map[k] || { name: e.name, sessions: [] }).sessions.push({ day: w.day, best, est: e1rm(best), sets: e.sets });
  }));
  EXP = Object.values(map).sort((a, b) => a.sessions.at(-1).day < b.sessions.at(-1).day ? 1 : -1);
  drawProgressList();
});
function drawProgressList(){
  openSheet(`<div class="sh-head"><h3>Übungsfortschritt</h3><button class="btn sm ghost" onclick="closeSheet()">Schließen</button></div>
    ${EXP.length ? '<div class="list">' + EXP.map((x, i) => { const b = x.sessions.reduce((a, s) => s.est > a.est ? s : a);
      return `<div class="row tap" onclick="drawProgress(${i})"><div class="grow"><div class="t">${esc(x.name)}</div><div class="s">${x.sessions.length} Einheiten, zuletzt ${shortDate(x.sessions.at(-1).day)}</div></div><div class="k">${fmt1(num(b.best.kg)).replace(',0', '')} × ${b.best.reps}</div></div>`; }).join('') + '</div>'
      : '<div class="note">Noch keine Einheiten eingetragen.</div>'}`);
}
function drawProgress(i){
  const x = EXP[i], s = x.sessions;
  let prs = 0, top = 0; s.forEach((v, j) => { if (j && v.est > top + 0.01) prs++; top = Math.max(top, v.est); });
  const best = s.reduce((a, v) => v.est > a.est ? v : a);
  const first = s[0].est, last = s.at(-1).est;
  openSheet(`<div class="sh-head"><h3>${esc(x.name)}</h3><button class="btn sm ghost" onclick="drawProgressList()">Zurück</button></div>
    ${chart(s.map(v => ({ day: v.day, v: v.est, avg: v.est })), 'Geschätztes Maximalgewicht für eine Wiederholung, berechnet aus dem besten Satz je Einheit.')}
    <div class="stats"><div><b>${fmt1(best.est).replace(',0', '')}</b><span>Bestwert kg (geschätzt)</span></div><div><b>${s.length > 1 ? (last - first >= 0 ? '+' : '−') + fmt(Math.abs((last - first) / (first || 1) * 100)) + ' %' : '–'}</b><span>seit Beginn</span></div><div><b>${prs}</b><span>Bestwerte</span></div></div>
    <div class="sec"><h3 style="margin-bottom:8px">Letzte Einheiten</h3><div class="list">${s.slice(-8).reverse().map(v => `<div class="row"><div class="grow"><div class="t">${dayLabel(v.day)}</div><div class="s">${v.sets.map(z1 => `${fmt1(num(z1.kg)).replace(',0', '')}×${z1.reps}`).join(', ')}</div></div><div class="k">${v === best ? '<span class="pr">Bestwert</span>' : ''}</div></div>`).join('')}</div></div>`);
}

/* ================= Wochenrückblick ================= */
let WR = null;
function openWeek(){ WR = { who: 'me', start: addDays(S.day, -wd(S.day)) }; drawWeek(); }
const drawWeek = run(async () => {
  const p = WR.who === 'partner' && S.partner ? S.partner : S.me, mine = p.id === S.user.id;
  const end = addDays(WR.start, 6), last = end > today() ? today() : end;
  const nDays = Math.max(0, daysBetween(WR.start, last) + 1);
  const canN = mine || shares(p, 'nutrition'), canT = mine || shares(p, 'training'), canW = mine || shares(p, 'weight');
  openSheet('<p class="muted">Lädt …</p>');
  const [logs, wos, ws] = await Promise.all([ canN ? q('log', p.id, WR.start, end) : [], canT ? q('workout', p.id, WR.start, end) : [], canW ? q('weight', p.id, addDays(WR.start, -7), end) : [] ]);
  let logged = 0, inR = 0, prot = 0, kSum = 0, tSum = 0;
  for (let i = 0; i < nDays; i++){
    const d = addDays(WR.start, i), dl = logs.filter(l => l.day === d), t = sum(dl);
    const tg = targetFor(p, d, wos.some(w => w.day === d));
    if (t.kcal >= (tg ? tg.kcal * 0.5 : 800)){ logged++; kSum += t.kcal; if (tg){ tSum += tg.kcal; if (Math.abs(t.kcal - tg.kcal) <= tg.kcal * 0.1) inR++; } }
    if (tg && t.p >= tg.p * 0.9) prot++;
  }
  const sets = wos.reduce((a, w) => a + w.data.exercises.reduce((b, e) => b + e.sets.length, 0), 0);
  const vol = wos.reduce((a, w) => a + w.data.exercises.reduce((b, e) => b + e.sets.reduce((c, s) => c + num(s.kg) * num(s.reps), 0), 0), 0);
  const avgW = arr => arr.length ? arr.reduce((a, w) => a + num(w.data.kg), 0) / arr.length : null;
  const wNow = avgW(ws.filter(w => w.day >= WR.start)), wPrev = avgW(ws.filter(w => w.day < WR.start));
  const avgK = logged ? kSum / logged : 0, avgT = logged && tSum ? tSum / logged : 0;
  const hints = [];
  if (nDays >= 3 && canN){
    if (logged < Math.min(5, nDays)) hints.push('Logge an mehr Tagen vollständig. Erst dann werden Wochenwerte und die Verbrauchsmessung aussagekräftig.');
    else if (avgT && avgK > avgT * 1.1) hints.push(`Im Schnitt ${fmt(avgK - avgT)} kcal über dem Ziel. Schau, welche Mahlzeit am häufigsten ausreißt.`);
    else if (avgT && avgK < avgT * 0.85) hints.push('Deutlich unter dem Ziel. Zu wenig zu essen kostet Leistung und Muskulatur, plane lieber eine Mahlzeit mehr ein.');
    if (logged && prot < Math.ceil(logged * 0.6)) hints.push('Das Proteinziel wurde selten erreicht. Eine feste Proteinquelle pro Mahlzeit hilft am meisten.');
  }
  const planned = num(p.data?.sessions);
  if (canT && planned && nDays === 7 && wos.length < planned) hints.push(`${wos.length} von ${planned} geplanten Einheiten. Ein fester Termin im Kalender macht es leichter.`);
  if (!hints.length && logged >= 5) hints.push('Starke Woche. Genau diese Beständigkeit bringt die Ergebnisse.');
  const tile = (v, l) => `<div><b>${v}</b><span>${l}</span></div>`;
  openSheet(`<div class="sh-head"><h3>Wochenrückblick</h3><button class="btn sm ghost" onclick="closeSheet()">Schließen</button></div>
    ${S.partner ? `<div class="seg"><button class="${WR.who === 'me' ? 'on' : ''}" onclick="WR.who='me';drawWeek()">Ich</button><button class="${WR.who === 'partner' ? 'on' : ''}" onclick="WR.who='partner';drawWeek()">${esc(nameOf(S.partner))}</button></div>` : ''}
    <div class="sec-h"><button class="btn sm ghost" onclick="WR.start=addDays(WR.start,-7);drawWeek()" aria-label="Vorherige Woche">‹</button><b>${shortDate(WR.start)} bis ${shortDate(end)}</b><button class="btn sm ghost" ${end >= today() ? 'disabled' : ''} onclick="WR.start=addDays(WR.start,7);drawWeek()" aria-label="Nächste Woche">›</button></div>
    ${canN ? `<div class="stats">${tile(logged + '/' + nDays, 'Tage geloggt')}${tile(avgK ? fmt(avgK) : '–', avgT ? 'Ø kcal, Ziel ' + fmt(avgT) : 'Ø kcal')}${tile(inR, 'Tage im Ziel')}</div><div class="stats">${tile(prot, 'Tage Proteinziel')}` : '<div class="note" style="margin-top:10px">Ernährung wird nicht geteilt.</div><div class="stats">'}
    ${canT ? tile(wos.length, 'Trainings') + tile(fmt(vol / 1000) + ' t', sets + ' Sätze Volumen') : ''}</div>
    ${canW ? `<div class="stats">${tile(wNow ? fmt1(wNow) : '–', 'Ø Gewicht kg')}${tile(wNow && wPrev ? (wNow - wPrev >= 0 ? '+' : '−') + fmt1(Math.abs(wNow - wPrev)) : '–', 'zur Vorwoche')}<div style="background:none"></div></div>` : ''}
    ${hints.length ? `<div class="sec"><h3 style="margin-bottom:8px">Vom Coach</h3><div class="list">${hints.map(h => `<div class="row small">${h}</div>`).join('')}</div></div>` : ''}`);
});

let P = null;
async function openPicker(opts){
  P = { tab:'suche', results:[], lib:null, basket:[], ...opts };
  if (P.mode === 'log' && P.slot) S.openSlot = P.slot;
  drawPicker();
  P.lib = await loadLib(); if (P.tab === 'suche' && !P.results.length) showResults(P.lib.slice(0, 30), 'Eigene und zuletzt verwendete');
}
async function loadLib(){
  const ids = [S.user.id, S.partner?.id].filter(Boolean);
  const [foods, logs] = await Promise.all([ Promise.all(ids.map(id => q('food', id))).then(x => x.flat()), q('log', S.user.id, addDays(today(), -45), null) ]);
  const seen = new Set(), out = [];
  foods.forEach(f => { const k = f.data.name.toLowerCase(); if (!seen.has(k)){ seen.add(k); out.push({ ...f.data, src:'eigen' }); } });
  logs.reverse().forEach(l => { if (!l.data.per) return; const k = l.data.name.toLowerCase(); if (!seen.has(k)){ seen.add(k); out.push({ name:l.data.name, per:l.data.per, serving:l.data.grams, src:'zuletzt' }); } });
  return out;
}

/* ---------- Barcode-Scanner (Dauerbetrieb) ---------- */
let scanner = null, lastCode = { c: '', t: 0 };
async function startScan(){
  const box = $('#reader');
  if (!window.Html5Qrcode){ box.outerHTML = '<div class="note">Der Scanner konnte nicht geladen werden. Tippe die Nummer unten ein.</div>'; return; }
  try {
    const F = Html5QrcodeSupportedFormats;
    scanner = new Html5Qrcode('reader', { formatsToSupport: [F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E], verbose: false });
    await scanner.start({ facingMode: 'environment' }, { fps: 10, qrbox: { width: 260, height: 130 } },
      code => { const now = Date.now(); if (code === lastCode.c && now - lastCode.t < 4000) return; lastCode = { c: code, t: now }; lookupCode(code); }, () => {});
  } catch (e) {
    scanner = null;
    box.outerHTML = `<div class="note">Die Kamera ist nicht verfügbar. Erlaube den Kamerazugriff für diese Seite (iPhone: Einstellungen, Safari, Kamera) oder tippe die Nummer unten ein.</div>`;
  }
}
async function stopScan(){ const s = scanner; scanner = null; if (s){ try { await s.stop(); s.clear(); } catch (e) {} } }
async function lookupCode(code){
  if (!code) return;
  const msg = $('#scanmsg'); if (msg) msg.innerHTML = `<p class="muted">Suche ${esc(code)} …</p>`;
  const lib = P.lib || await loadLib();
  const ownHit = lib.find(f => f.barcode === code);
  const done = f => { basketAdd(f); if ($('#scanmsg')) $('#scanmsg').innerHTML = `<p class="small" style="font-weight:700">✓ ${esc(f.name)} im Korb. Nächstes Produkt scannen oder unten speichern.</p>`; if (navigator.vibrate) navigator.vibrate(60); };
  if (ownHit) return done(ownHit);
  if (!navigator.onLine){ if ($('#scanmsg')) $('#scanmsg').innerHTML = '<p class="err">Offline: Unbekannte Barcodes können erst mit Empfang nachgeschlagen werden.</p>'; return; }
  try {
    const res = await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json?fields=${OFF_FIELDS}`);
    const js = await res.json();
    const food = js.status === 1 ? offMap({ ...js.product, code }) : null;
    if (food) return done(food);
    await stopScan();
    P.tab = 'eigen'; P.prefillCode = code; P.prefillName = js.product?.product_name || '';
    drawPicker(); toast('Produkt ohne Nährwerte. Bitte von der Verpackung eintragen.');
  } catch (e) {
    if ($('#scanmsg')) $('#scanmsg').innerHTML = '<p class="err">Open Food Facts ist gerade nicht erreichbar.</p>';
  }
}

const woVolume = w => (w.data.exercises || []).reduce((a, e) => a + e.sets.reduce((b, s) => b + num(s.kg) * num(s.reps), 0), 0);
// Geschätzte Dauer: Sätze × (Pause + 45 s Satzzeit), auf 5 min gerundet
const estMinutes = r => Math.max(5, Math.round(r.data.exercises.reduce((a, e) => a + (num(e.sets) || 3), 0) * (restDefault() + 45) / 300) * 5);
// „Dran“ ist der Trainingstag, der am längsten nicht trainiert wurde (ergibt die Rotation, auch nach Aussetzern)
function lastTrained(r, wos){
  const n = (r.data.name || '').trim().toLowerCase();
  return wos.filter(w => w.data.routine_id === r.id || (w.data.name || '').trim().toLowerCase() === n).map(w => w.day).sort().at(-1) || null;
}
function nextRoutine(routines, wos){
  if (!routines.length) return null;
  return routines.map((r, i) => ({ r, i, last: lastTrained(r, wos) }))
    .sort((a, b) => (a.last || '') < (b.last || '') ? -1 : (a.last || '') > (b.last || '') ? 1 : a.i - b.i)[0];
}
async function rTraining(){
  const uid = viewId(), mine = own();
  if (!mine && !shares(S.partner, 'training')) return privNote('das Training');
  const [routines, wos, kd] = await Promise.all([ q('routine', uid), q('workout', uid, addDays(S.day, -42), S.day), S.partner ? kudosFor(mine ? S.partner.id : S.user.id, addDays(S.day, -42), S.day) : [] ]);
  S.rt = {}; routines.forEach(r => S.rt[r.id] = r);
  if (mine){ const seen = new Set(); S.exNames = []; [...routines.flatMap(r => r.data.exercises.map(e => e.name)), ...wos.slice().reverse().flatMap(w => w.data.exercises.map(e => e.name))].forEach(n => { const k = n.toLowerCase(); if (!seen.has(k)){ seen.add(k); S.exNames.push(n); } }); }
  let h = '';
  const dr = mine ? getDraft() : null;
  if (dr && !sheetOpen()) h += `<div class="draft"><div><b>Nicht gespeicherte Einheit</b><div class="small">${esc(dr.w.name)}, ${dayLabel(dr.w.day)}, ${(n => n === 1 ? '1 Satz' : n + ' Sätze')(dr.w.exercises.reduce((a, e) => a + e.sets.filter(s => num(s.reps)).length, 0))} eingetragen</div></div><div class="btns" style="margin-top:10px"><button class="btn" style="flex:1" onclick="resumeDraft()">Fortsetzen</button><button class="btn line" onclick="dropDraft()">Verwerfen</button></div></div>`;
  if (mine){
    h += `<div class="sec-h"><h2>Trainingstage</h2><button class="btn sm" onclick="openRoutine()">Neuer Trainingstag</button></div>`;
    h += routines.length ? '<div class="list">' + routines.map(r => `<div class="row"><div class="grow tap" onclick="openRoutine('${r.id}')"><div class="t">${esc(r.data.name)}</div><div class="s">${r.data.exercises.length} Übungen, bearbeiten</div></div><button class="btn sm accent" onclick="startWorkout('${r.id}')">Starten</button></div>`).join('') + '</div>'
      : '<div class="note">Lege deine Trainingstage an, z. B. Push, Pull, Beine. Beim Starten sind die Übungen dann schon eingetragen.</div>';
    h += `<div class="btns"><button class="btn line" onclick="startWorkout()">Freies Training starten</button></div>`;
  } else {
    h += `<h2>Trainingstage</h2><div class="sec">${routines.length ? '<div class="list">' + routines.map(r => `<div class="row"><div class="grow"><div class="t">${esc(r.data.name)}</div><div class="s">${r.data.exercises.map(e => esc(e.name)).join(', ')}</div></div></div>`).join('') + '</div>' : '<div class="note">Noch keine Trainingstage angelegt.</div>'}</div>`;
  }
  h += `<div class="sec"><div class="sec-h"><h2>Verlauf</h2><button class="btn sm ghost" onclick="openProgress()">Übungsfortschritt</button></div><p class="small muted" style="margin:-4px 0 10px">6 Wochen bis ${shortDate(S.day)}</p>`;
  h += wos.length ? wos.slice().reverse().map(w => {
    const vol = w.data.exercises.reduce((a, e) => a + e.sets.reduce((b, s) => b + num(s.kg) * num(s.reps), 0), 0);
    return `<details class="wo" ${w.day === S.day ? 'open' : ''}><summary><span><b>${esc(w.data.name)}</b> <span class="muted small">${dayLabel(w.day)}</span></span><span class="muted small">${fmt(vol)} kg Volumen</span></summary><div class="body">
      ${w.data.exercises.map(e => `<p><b>${esc(e.name)}</b>: ${e.sets.map(s => `${fmt1(num(s.kg)).replace(',0', '')}×${s.reps}`).join(', ')}</p>`).join('')}
      ${w.data.note ? `<p class="muted">${esc(w.data.note)}</p>` : ''}
      ${mine && kd.some(k => k.data.key === 'wo:' + w.id) ? `<div class="kudosin" style="margin:8px 0 0">${KUDOS_ICON}<span>Kudos von <b>${esc(nameOf(S.partner))}</b></span></div>` : ''}
      <div class="btns">${mine ? `<button class="btn sm ghost" onclick="editWorkout('${w.id}')">Bearbeiten</button>` : kudosBtn('wo:' + w.id, w.day, kd.some(k => k.data.key === 'wo:' + w.id), w.data.name)}</div></div></details>`; }).join('')
    : '<div class="note">In diesem Zeitraum ist kein Training eingetragen.</div>';
  return h + '</div>';
}

};
const PRESETS = [[3,8,8],[3,10,10],[3,12,12],[4,6,8],[3,8,12],[5,5,5]];
const scheme = (s, f, t) => `${s} × ${f === t ? f : f + '–' + t}`;
function splitReps(r){ const [f, t] = String(r || '10').split(/[-–]/).map(x => parseInt(x)); return { from: f || 10, to: t || f || 10 }; }
function knownScheme(name){
  const k = name.toLowerCase();
  for (const r of Object.values(S.rt || {})) for (const e of r.data.exercises) if (e.name.toLowerCase() === k){ const x = splitReps(e.reps); return scheme(e.sets, x.from, x.to); }
  return '';
}
let L = null;
function openExLib(opts){ L = { group: (S.exNames || []).length ? 'Zuletzt' : 'Alle', q: '', sel: null, ...opts }; drawExLib(); }
function libItems(){
  const own = (S.exNames || []).map(n => [n, 'Zuletzt verwendet']);
  let items = L.group === 'Zuletzt' ? own : L.group === 'Alle' ? Object.values(EX_LIB).flat() : (EX_LIB[L.group] || []);
  const q = L.q.trim().toLowerCase();
  if (q){
    const all = [...own, ...Object.values(EX_LIB).flat()], seen = new Set();
    items = all.filter(([n]) => { const k = n.toLowerCase(); if (seen.has(k) || !k.includes(q)) return false; seen.add(k); return true; });
  }
  return items;
}
function drawExLib(){
  const groups = [...((S.exNames || []).length ? ['Zuletzt'] : []), 'Alle', ...Object.keys(EX_LIB)];
  openSheet(`<div class="sh-head"><h3>Übung hinzufügen</h3><button class="btn sm ghost" onclick="L.back()">Fertig</button></div>
    <input id="exq" type="search" placeholder="Übung suchen oder neu anlegen" value="${esc(L.q)}" oninput="L.q=this.value;drawLibList()" aria-label="Übung suchen">
    <div class="chiprow">${groups.map(g => `<button class="${L.group === g && !L.q ? 'on' : ''}" onclick="L.group='${g}';L.q='';drawExLib()">${g}</button>`).join('')}</div>
    <div id="liblist"></div><div id="libsel"></div>`);
  drawLibList();
}
function drawLibList(){
  const items = libItems(), have = new Set(L.have());
  const q = L.q.trim();
  let h = '<div class="list">' + items.map(([n, sub]) => {
    const on = have.has(n.toLowerCase());
    return `<div class="row"><div class="grow"><div class="t">${esc(n)}</div><div class="s">${esc(sub)}</div></div>${on
      ? `<span class="okdot" aria-label="Bereits hinzugefügt">✓</span>`
      : `<button class="plus" aria-label="${esc(n)} hinzufügen" onclick="libSelect(this.dataset.n)" data-n="${esc(n)}">+</button>`}</div>`;
  }).join('');
  if (q && !items.some(([n]) => n.toLowerCase() === q.toLowerCase()))
    h += `<div class="row tap" onclick="libSelect(this.dataset.n)" data-n="${esc(q)}"><div class="grow"><div class="t">„${esc(q)}“ als neue Übung</div><div class="s">Eigene Übung anlegen</div></div><span class="plus" aria-hidden="true">+</span></div>`;
  if (!items.length && !q) h += '<div class="row muted">Keine Übungen in dieser Gruppe.</div>';
  $('#liblist').innerHTML = h + '</div>';
}
function libSelect(name){
  L.sel = name;
  const last = knownScheme(name);
  $('#libsel').innerHTML = `<div class="selpanel"><div class="sec-h" style="margin-bottom:4px"><h3>${esc(name)}</h3>${last ? `<span class="small muted" style="font-weight:600">Zuletzt: ${last}</span>` : ''}</div>
    <div class="small muted" style="font-weight:700;margin-bottom:6px">Vorgabe antippen</div>
    <div class="presets">${PRESETS.map(([s, f, t], i) => `<button onclick="libAdd(${i})">${scheme(s, f, t)}</button>`).join('')}</div>
    <div class="btns" style="margin-top:10px"><button class="btn line" style="flex:1" onclick="L.sel=null;$('#libsel').innerHTML=''">Abbrechen</button><button class="btn ghost" style="flex:1" onclick="libAdd(-1)">Eigene Werte</button></div></div>`;
  $('#libsel').scrollIntoView({ behavior: 'smooth', block: 'end' });
}
function libAdd(i){
  const [s, f, t] = i >= 0 ? PRESETS[i] : [3, 10, 10];
  L.onAdd({ name: L.sel, sets: s, from: f, to: t });
  toast(L.sel + ' hinzugefügt');
  if (i < 0) return L.back();
  L.sel = null; $('#libsel').innerHTML = ''; drawLibList();
}

/* ---------- Trainingstag-Editor ---------- */
let RO = null;
function openRoutine(id){
  const r = id ? S.rt[id] : null;
  RO = { id, name: r?.data.name || '', exercises: r ? r.data.exercises.map(e => ({ name: e.name, sets: e.sets, ...splitReps(e.reps) })) : [] };
  drawRoutine();
}
function drawRoutine(){
  openSheet(`<div class="sh-head"><h3>${RO.id ? 'Trainingstag bearbeiten' : 'Neuer Trainingstag'}</h3><button class="btn sm ghost" onclick="closeSheet()">Schließen</button></div>
    <label class="f"><span>Name</span><input value="${esc(RO.name)}" oninput="RO.name=this.value" placeholder="z. B. Oberkörper A"></label>
    ${RO.exercises.map((e, i) => `<div class="ex">
      <div class="ex-h">
        <div class="ord"><button aria-label="Nach oben" ${i ? '' : 'disabled'} onclick="moveEx(${i},-1)">▲</button><button aria-label="Nach unten" ${i < RO.exercises.length - 1 ? '' : 'disabled'} onclick="moveEx(${i},1)">▼</button></div>
        <input value="${esc(e.name)}" aria-label="Name der Übung" oninput="RO.exercises[${i}].name=this.value">
        <button class="iconbtn" aria-label="Übung entfernen" onclick="RO.exercises.splice(${i},1);drawRoutine()">×</button></div>
      <div class="exgrid">
        <div><div class="lbl">Sätze</div><div class="stepper"><button aria-label="Weniger Sätze" onclick="stepSets(${i},-1)">−</button><b id="ss${i}">${e.sets}</b><button class="plus" aria-label="Mehr Sätze" onclick="stepSets(${i},1)">+</button></div></div>
        <div><div class="lbl">Wiederholungen</div><div class="reps"><input inputmode="numeric" aria-label="Wiederholungen von" value="${e.from}" oninput="RO.exercises[${i}].from=parseInt(this.value)||0"><span>bis</span><input inputmode="numeric" aria-label="Wiederholungen bis" value="${e.to}" oninput="RO.exercises[${i}].to=parseInt(this.value)||0"></div></div>
      </div></div>`).join('')}
    <button class="dashed" onclick="openExLib({have:()=>RO.exercises.map(e=>e.name.toLowerCase()),onAdd:x=>RO.exercises.push(x),back:drawRoutine})">+ Übung hinzufügen</button>
    <button class="btn ghost full" style="margin-top:8px" onclick="drawTextImport()">Plan als Text einfügen</button>
    <div class="btns"><button class="btn accent" style="flex:1" onclick="saveRoutine()">Trainingstag speichern</button>${RO.id ? `<button class="btn danger" onclick="deleteRoutine()">Löschen</button>` : ''}</div>`);
}
function stepSets(i, d){ const e = RO.exercises[i]; e.sets = Math.max(1, Math.min(10, e.sets + d)); $('#ss' + i).textContent = e.sets; }
function moveEx(i, d){ const a = RO.exercises, j = i + d; if (j < 0 || j >= a.length) return; [a[i], a[j]] = [a[j], a[i]]; drawRoutine(); }
function parseLine(l){
  l = l.trim().replace(/^[-•*\d.)\s]+(?=\D)/, ''); if (!l) return null;
  const clamp = n => Math.max(1, Math.min(10, n || 3));
  if (/[;|]/.test(l)){ const p = l.split(/[;|]/).map(s => s.trim()); return { name: p[0], sets: clamp(parseInt(p[1])), ...splitReps(p[2]) }; }
  const m = l.match(/^(.*?)[\s,:]+(\d{1,2})\s*[x×*]\s*(\d{1,3})(?:\s*[-–]\s*(\d{1,3}))?\s*(?:wdh\.?|wiederholungen|reps?)?$/i);
  if (m && m[1].trim()) return { name: m[1].trim(), sets: clamp(+m[2]), from: +m[3], to: +(m[4] || m[3]) };
  return { name: l, sets: 3, from: 10, to: 10, guess: true };
}
function drawTextImport(){
  openSheet(`<div class="sh-head"><h3>Plan als Text einfügen</h3><button class="btn sm ghost" onclick="drawRoutine()">Zurück</button></div>
    <label class="f"><span>Eine Übung pro Zeile, so wie du sie aufschreiben würdest</span><textarea id="tim" oninput="previewImport()" placeholder="Kniebeuge 5x5&#10;Rumänisches Kreuzheben 3x8-10&#10;Beinpresse 3 x 12"></textarea></label>
    <div id="timp"></div>
    <p class="small muted">Erkannt werden zum Beispiel 4x8, 4 x 8, 3x8-10 oder nur der Name. Ohne Angabe setzt die App 3 × 10.</p>
    <div class="btns"><button class="btn accent full" onclick="applyImport()">Übernehmen</button></div>`);
}
function previewImport(){
  const rows = $('#tim').value.split('\n').map(parseLine).filter(Boolean);
  $('#timp').innerHTML = rows.length ? `<div class="small muted" style="font-weight:700;margin-bottom:6px">So wird es übernommen</div><div class="list">${rows.map(r => `<div class="row"><span class="okdot ${r.guess ? 'guess' : ''}">${r.guess ? '?' : '✓'}</span><div class="grow t">${esc(r.name)}</div><div class="k num" style="font-size:18px">${scheme(r.sets, r.from, r.to)}</div></div>`).join('')}</div>` : '';
}
function applyImport(){
  const rows = $('#tim').value.split('\n').map(parseLine).filter(Boolean);
  if (!rows.length) return toast('Bitte mindestens eine Übung eintragen');
  rows.forEach(r => RO.exercises.push({ name: r.name, sets: r.sets, from: r.from, to: r.to }));
  toast(rows.length + (rows.length === 1 ? ' Übung' : ' Übungen') + ' übernommen'); drawRoutine();
}
const saveRoutine = run(async () => {
  const name = RO.name.trim();
  const exercises = RO.exercises.filter(e => e.name.trim()).map(e => {
    let f = e.from || 10, t = e.to || f; if (t < f) [f, t] = [t, f];
    return { name: e.name.trim(), sets: e.sets, reps: f === t ? String(f) : `${f}-${t}` };
  });
  if (!name) return toast('Gib dem Trainingstag einen Namen');
  if (!exercises.length) return toast('Füge mindestens eine Übung hinzu');
  if (RO.id) await upd(RO.id, { name, exercises }); else await add('routine', null, { name, exercises });
  closeSheet(); toast('Trainingstag gespeichert'); render();
});
const deleteRoutine = run(async () => { if (!confirm('Trainingstag löschen? Bereits geloggte Einheiten bleiben erhalten.')) return; await del(RO.id); closeSheet(); render(); });

/* ---------- Einheit loggen ---------- */
let W = null;
async function lastMap(excludeId){
  const ws = await q('workout', S.user.id, addDays(today(), -180), null);
  const m = {};
  ws.forEach(w => { if (w.id === excludeId) return; w.data.exercises.forEach(e => { if (e.sets.some(s => num(s.reps))) m[e.name.toLowerCase()] = { day: w.day, sets: e.sets }; }); });
  return m;
}
const startWorkout = run(async rid => {
  unlockAudio();
  const r = rid ? S.rt[rid] : null;
  W = { day: S.day, routine_id: rid || null, name: r ? r.data.name : 'Freies Training', note: '',
        exercises: r ? r.data.exercises.map(e => ({ name: e.name, target: e.reps, sets: Array.from({ length: e.sets }, () => ({ kg:'', reps:'' })) })) : [],
        last: await lastMap() };
  drawWorkout();
});
const editWorkout = run(async id => {
  unlockAudio();
  const w = (await sb.from('entries').select('*').eq('id', id).single()).data;
  W = { id, day: w.day, ...JSON.parse(JSON.stringify(w.data)), last: await lastMap(id) };
  drawWorkout();
});
function drawWorkout(){
  const lastTxt = n => { const l = W.last[n.toLowerCase()]; return l ? `Zuletzt ${shortDate(l.day)}: ${l.sets.filter(s => num(s.reps)).map(s => `${fmt1(num(s.kg)).replace(',0', '')}×${s.reps}`).join(', ')}` : ''; };
  const lastSet = (n, j) => { const l = W.last[n.toLowerCase()]; return l ? (l.sets[j] || l.sets.at(-1)) : null; };
  openSheet(`<div class="sh-head"><h3>${W.id ? 'Einheit bearbeiten' : 'Training, ' + dayLabel(W.day)}</h3><button class="btn sm ghost" onclick="if(confirm('Ohne Speichern schließen? Die Einheit wird verworfen.')){clearDraft();closeSheet()}">Schließen</button></div><div oninput="saveDraft()">
    <label class="f"><span>Bezeichnung</span><input value="${esc(W.name)}" oninput="W.name=this.value"></label>
    ${W.exercises.map((e, i) => `<div class="ex">
      <div class="ex-h"><input value="${esc(e.name)}" placeholder="Übung" oninput="W.exercises[${i}].name=this.value"><button class="iconbtn" aria-label="Übung entfernen" onclick="W.exercises.splice(${i},1);drawWorkout()">×</button></div>
      <div class="last">${e.target ? 'Ziel: ' + esc(e.target) + ' Wdh. ' : ''}${esc(lastTxt(e.name))}</div>
      ${e.sets.map((s, j) => { const ls = lastSet(e.name, j); return `<div class="setrow"><span class="n">${j + 1}</span>
        <input inputmode="decimal" aria-label="Gewicht in kg" placeholder="${ls ? esc(ls.kg) : 'kg'}" value="${esc(s.kg)}" oninput="W.exercises[${i}].sets[${j}].kg=this.value">
        <span class="muted">×</span>
        <input inputmode="numeric" aria-label="Wiederholungen" placeholder="${ls ? esc(ls.reps) : 'Wdh'}" value="${esc(s.reps)}" oninput="W.exercises[${i}].sets[${j}].reps=this.value" onchange="if(this.value)autoRest()">
        <button class="btn sm ghost" style="padding:4px" aria-label="Wie letztes Mal" ${ls ? '' : 'disabled'} onclick="copyLast(${i},${j})">=</button>
        <button class="iconbtn" aria-label="Satz entfernen" onclick="W.exercises[${i}].sets.splice(${j},1);drawWorkout()">×</button></div>`; }).join('')}
      <button class="btn sm ghost" onclick="addSet(${i})">+ Satz</button></div>`).join('')}
    <div class="btns" style="margin-top:0"><button class="dashed" onclick="openExLib({have:()=>W.exercises.map(e=>e.name.toLowerCase()),onAdd:x=>W.exercises.push({name:x.name,target:x.from===x.to?String(x.from):x.from+'-'+x.to,sets:Array.from({length:x.sets},()=>({kg:'',reps:''}))}),back:drawWorkout})">+ Übung hinzufügen</button></div>
    <label class="f" style="margin-top:14px"><span>Notiz</span><input value="${esc(W.note || '')}" oninput="W.note=this.value" placeholder="z. B. Schulter gezwickt, Schlaf schlecht"></label>
    ${W.id ? `<div class="btns"><button class="btn danger" onclick="deleteWorkout()">Einheit löschen</button></div>` : ''}
    </div><div class="wbar"><div id="restbar" class="restbar"></div><div class="wrow"><span id="autot">${autotHtml()}</span><button class="btn accent" style="flex:1" onclick="saveWorkout()">Einheit speichern</button></div></div>`);
  tickRest(); saveDraft();
}
function copyLast(i, j){ const e = W.exercises[i]; const l = W.last[e.name.toLowerCase()]; const s = l && (l.sets[j] || l.sets.at(-1)); if (s){ e.sets[j] = { kg: s.kg, reps: s.reps }; autoRest(); drawWorkout(); } }
function addSet(i){ const s = W.exercises[i].sets; const prev = s.at(-1) || { kg:'', reps:'' }; s.push({ kg: prev.kg, reps: prev.reps }); drawWorkout(); }
const saveWorkout = run(async () => {
  const exercises = W.exercises.map(e => ({ name: e.name.trim(), target: e.target || '', sets: e.sets.filter(s => num(s.reps)).map(s => ({ kg: num(s.kg), reps: num(s.reps) })) }))

const MEAS = [['taille','Taille'],['huefte','Hüfte'],['brust','Brust'],['arm','Oberarm'],['bein','Oberschenkel']];
function trend(ws){ // 7-Tage-Mittel je Eintrag
  return ws.map(w => { const win = ws.filter(x => x.day <= w.day && daysBetween(x.day, w.day) < 7); return { day: w.day, v: num(w.data.kg), avg: win.reduce((a, x) => a + num(x.data.kg), 0) / win.length }; });
}
function chart(pts, caption){
  if (pts.length < 2) return '<div class="note">Ab zwei Einträgen erscheint hier der Verlauf.</div>';
  const Wd = 340, Ht = 160, L = 34, B = 20, T = 8, Rr = 8;
  const vals = pts.flatMap(p => [p.v, p.avg]); const lo = Math.floor(Math.min(...vals) - .3), hi = Math.ceil(Math.max(...vals) + .3);
  const span = Math.max(1, daysBetween(pts[0].day, pts.at(-1).day));
  const X = d => L + daysBetween(pts[0].day, d) / span * (Wd - L - Rr);
  const Y = v => T + (hi - v) / (hi - lo || 1) * (Ht - T - B);
  const line = pts.map(p => `${X(p.day).toFixed(1)},${Y(p.avg).toFixed(1)}`).join(' ');
  return `<div class="chart"><svg viewBox="0 0 ${Wd} ${Ht}" role="img" aria-label="Gewichtsverlauf">
    <g font-size="10" fill="var(--muted)" font-family="Archivo, sans-serif">
      <text x="2" y="${Y(hi) + 4}">${hi}</text><text x="2" y="${Y(lo) + 4}">${lo}</text>
      <text x="${L}" y="${Ht - 4}">${shortDate(pts[0].day)}</text><text x="${Wd - Rr}" y="${Ht - 4}" text-anchor="end">${shortDate(pts.at(-1).day)}</text></g>
    <line x1="${L}" x2="${Wd - Rr}" y1="${Y(hi)}" y2="${Y(hi)}" stroke="var(--line)"/><line x1="${L}" x2="${Wd - Rr}" y1="${Y(lo)}" y2="${Y(lo)}" stroke="var(--line)"/>
    ${pts.map(p => `<circle cx="${X(p.day).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="2.5" fill="var(--muted)" opacity=".55"/>`).join('')}
    <polyline points="${line}" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  </svg><div class="small muted">${caption || 'Punkte: Tageswerte. Linie: 7-Tage-Durchschnitt, der aussagekräftigere Wert.'}</div></div>`;
}
async function rKoerper(){
  const uid = viewId(), mine = own();
  const [ws, ms] = await Promise.all([ q('weight', uid, addDays(S.day, -120), S.day), q('measure', uid, null, S.day) ]);
  const tw = ws.find(w => w.day === S.day), tm = ms.find(m => m.day === S.day);
  const tr = trend(ws);
  const hideW = !mine && !shares(S.partner, 'weight'), hideM = !mine && !shares(S.partner, 'measure');
  let h = '';
  if (mine) h += `<div class="card"><label class="f" style="margin:0"><span>Gewicht ${dayLabel(S.day) === 'Heute' ? 'heute' : 'am ' + shortDate(S.day)} (morgens, nüchtern)</span>
    <div class="searchrow" style="margin:0"><input id="wkg" inputmode="decimal" placeholder="kg" value="${tw ? String(tw.data.kg).replace('.', ',') : ''}"><button class="btn" onclick="saveWeight('${tw?.id || ''}')">Speichern</button></div></label></div>`;
  h += `<div class="sec"><h2 style="margin-bottom:8px">Gewicht</h2>${hideW ? privNote('das Gewicht') : chart(tr)}`;
  if (tr.length >= 2){

    const r7 = ref(7), r30 = ref(28);
    const dlt = r => r ? (last.avg - r.avg >= 0 ? '+' : '') + fmt1(last.avg - r.avg) : 'k. A.';
    h += `<div class="stats"><div><b>${fmt1(last.avg)}</b><span>Ø aktuell, kg</span></div><div><b>${dlt(r7)}</b><span>seit 7 Tagen</span></div><div><b>${dlt(r30)}</b><span>seit 4 Wochen</span></div></div>`;
  }
  h += '</div><div class="sec"><h2 style="margin-bottom:8px">Körpermaße</h2>';
  if (mine) h += `<div class="card"><p class="small muted" style="margin-top:0">In cm, z. B. alle zwei Wochen. Leere Felder werden übersprungen.</p><div class="grid2">${MEAS.map(([k, l]) => `<label class="f"><span>${l}</span><input id="m_${k}" inputmode="decimal" value="${tm?.data[k] ? String(tm.data[k]).replace('.', ',') : ''}"></label>`).join('')}</div>

  if (ms.length){

    h += `<div class="sec" style="margin-top:12px"><div style="overflow-x:auto"><table class="m"><thead><tr><th>Maß</th><th>Start</th><th>Aktuell</th><th>Differenz</th></tr></thead><tbody>${MEAS.map(([k, l]) => {
      const a = first(k), b = latest(k); if (!a) return '';
      const d = num(b.data[k]) - num(a.data[k]);
      return `<tr><td>${l}</td><td>${fmt1(a.data[k])}<div class="small muted">${shortDate(a.day)}</div></td><td>${fmt1(b.data[k])}<div class="small muted">${shortDate(b.day)}</div></td><td>${d > 0 ? '+' : ''}${fmt1(d)}</td></tr>`; }).join('')}</tbody></table></div></div>`;
  } else if (hideM) h += privNote('die Körpermaße');
  else if (!mine) h += '<div class="note">Noch keine Maße eingetragen.</div>';
  return h + '</div>';
}

function readCalc(){

    trainDays: [...f.querySelectorAll('input[name=td]:checked')].map(x => +x.value), cycle: f.elements.cycle.checked,
    goal: g('goal'), rate: num(g('rate')), protein: num(g('protein')), fat: num(g('fat')), adaptiveTdee: S.me.data.adaptiveTdee || null };
}
function calcUpdate(){
  const d = readCalc(); if (!d) return;
  $('#ratef').style.display = ['cut','bulk'].includes(d.goal) ? '' : 'none';
  $('#ratel').textContent = d.goal === 'bulk' ? 'Zunahme in % Körpergewicht pro Monat' : 'Abnahme in % Körpergewicht pro Woche';
  const r = calc(d); const out = $('#calcres');
  if (!r.ok){ out.innerHTML = '<p class="muted" style="margin:0">Trag Geburtsjahr, Größe und Gewicht ein, dann erscheint hier die Berechnung.</p>'; return; }
  const sign = n => (n >= 0 ? '+' : '−') + fmt(Math.abs(n));
  const goalTxt = { cut: `Defizit (${fmt1(d.rate)} % pro Woche ≈ ${fmt1(d.rate / 100 * d.weight)} kg)`, bulk: `Überschuss (${fmt1(d.rate)} % pro Monat ≈ ${fmt1(d.rate / 100 * d.weight)} kg)`, recomp: 'Leichtes Defizit (5 %)', maintain: 'Keine Anpassung' }[d.goal];
  const box = (title, t) => `<div><span class="small muted">${title}</span><b>${fmt(t.kcal)}</b><span class="small">P ${t.p} g, KH ${t.c} g, F ${t.f} g</span></div>`;
  out.innerHTML = `
    <div class="calc-line"><span>Grundumsatz, ${r.method}</span><span>${fmt(r.bmr)} kcal</span></div>
    <div class="calc-line"><span>Alltag und Verdauung (Grundumsatz × 1,2)</span><span>${sign(r.base - r.bmr)} kcal</span></div>
    <div class="calc-line"><span>Zusätzliche Schritte über 3.000</span><span>${sign(r.stepsK)} kcal</span></div>
    <div class="calc-line"><span>Training pro Einheit, netto</span><span>${sign(r.sessionK)} kcal</span></div>
    <div class="calc-line"><span><b>Ø Verbrauch pro Tag${r.adaptive ? ', laut Formel' : ''}</b></span><span><b>${fmt(r.avgTdee)} kcal</b></span></div>
    ${r.adaptive ? `<div class="calc-line"><span><b>Gemessener Verbrauch (wird verwendet)</b></span><span><b>${fmt(r.adaptive)} kcal</b></span></div>` : ''}
    <div class="calc-line"><span>${goalTxt}</span><span>${sign(r.adj)} kcal</span></div>
    <div class="tgt">${r.targets.cycle ? box('Trainingstag', r.targets.train) + box('Ruhetag', r.targets.rest) : box('Tagesziel', r.targets.avg)}</div>
    ${r.warn.map(w => `<div class="warnbox">${esc(w)}</div>`).join('')}`;
}
const saveTargets = run(async () => {
  const d = readCalc(); const r = calc(d);
  if (!r.ok) return toast('Geburtsjahr, Größe und Gewicht fehlen');

  toast('Ziele gespeichert');

async function runAdaptive(){
  const box = $('#adapt');
  const from = addDays(today(), -28), to = addDays(today(), -1);
  const [ws, logs] = await Promise.all([ q('weight', S.user.id, from, to), q('log', S.user.id, from, to) ]);
  const byDay = {}; logs.forEach(l => byDay[l.day] = (byDay[l.day] || 0) + num(l.data.kcal));
  const days = Object.keys(byDay).filter(k => byDay[k] > 600);
  const spanW = ws.length ? daysBetween(ws[0].day, ws.at(-1).day) : 0;
  if (ws.length < 6 || spanW < 13 || days.length < 10){
    box.innerHTML = `<p style="margin-top:0">Noch zu wenig Daten. Benötigt in den letzten 4 Wochen: mindestens 6 Gewichtseinträge über 2 Wochen verteilt (aktuell ${ws.length}, über ${spanW} Tage) und 10 vollständig geloggte Tage (aktuell ${days.length}).</p><button class="btn ghost" onclick="runAdaptive()">Erneut prüfen</button>`;
    return;
  }
  const xs = ws.map(w => daysBetween(from, w.day)), ys = ws.map(w => num(w.data.kg));
  const mx = xs.reduce((a, b) => a + b) / xs.length, my = ys.reduce((a, b) => a + b) / ys.length;
  const slope = xs.reduce((a, x, i) => a + (x - mx) * (ys[i] - my), 0) / (xs.reduce((a, x) => a + (x - mx) ** 2, 0) || 1);
  const avgIn = days.reduce((a, k) => a + byDay[k], 0) / days.length;
  const tdee = Math.round(avgIn - slope * 7700);
  const formula = calc(readCalc() || {}); 
  box.innerHTML = `<div class="calc-line"><span>Ø Aufnahme an ${days.length} geloggten Tagen</span><span>${fmt(avgIn)} kcal</span></div>
    <div class="calc-line"><span>Gewichtstrend</span><span>${slope * 7 >= 0 ? '+' : '−'}${fmt1(Math.abs(slope * 7))} kg pro Woche</span></div>
    <div class="calc-line"><span><b>Gemessener Verbrauch</b></span><span><b>${fmt(tdee)} kcal</b></span></div>
    ${formula.ok ? `<div class="calc-line"><span>Zum Vergleich laut Formel</span><span>${fmt(formula.avgTdee)} kcal</span></div>` : ''}
    <p class="small muted">Nur verlässlich, wenn an den geloggten Tagen wirklich alles erfasst wurde. Ungeloggte Tage werden ignoriert.</p>
    <div class="btns"><button class="btn" onclick="applyAdaptive(${tdee})">Als Basis übernehmen</button></div>`;
}
const applyAdaptive = run(async v => {
  const d = { ...(readCalc() || S.me.data), adaptiveTdee: v || null };
  const r = calc(d);
  await saveProfile({ adaptiveTdee: v || null, ...(r.ok ? { targets: r.targets } : {}) });
  toast(v ? 'Gemessener Verbrauch übernommen, Ziele aktualisiert' : 'Ziele basieren wieder auf der Formel');
  render();
});

  document.body.classList.remove('in');
  $('#view').dataset.tab = '';
  $('#view').innerHTML = `<div class="auth"><svg width="84" height="84" viewBox="0 0 180 180" aria-hidden="true"><rect width="180" height="180" rx="40" fill="#15181C"/><circle cx="90" cy="90" r="40" fill="#FFB81C"/><rect x="34" y="84" width="112" height="12" rx="6" fill="#F2F3F0"/><rect x="26" y="66" width="13" height="48" rx="5" fill="#F2F3F0"/><rect x="141" y="66" width="13" height="48" rx="5" fill="#F2F3F0"/></svg><h1>Spotter</h1><p class="muted">Euer Trainingspartner für Ernährung, Training und Fortschritt.</p>
    <label class="f"><span>E-Mail</span><input id="ae" type="email" autocomplete="email"></label>
    <label class="f"><span>Passwort</span><input id="ap" type="password" autocomplete="current-password"></label>
    <label class="f" id="anf" style="display:none"><span>Dein Name</span><input id="an" autocomplete="given-name"></label>
    <div id="amsg" class="small ${msg ? 'err' : ''}">${esc(msg)}</div>
    <div class="btns"><button class="btn accent full" id="ab1" onclick="doLogin()">Anmelden</button>
    <button class="btn line full" id="ab2" onclick="toggleSignup()">Neues Konto erstellen</button></div></div>`;
}
let signup = false;
function toggleSignup(){
  signup = !signup;
  $('#anf').style.display = signup ? '' : 'none';
  $('#ab1').textContent = signup ? 'Konto erstellen' : 'Anmelden';
  $('#ab2').textContent = signup ? 'Ich habe schon ein Konto' : 'Neues Konto erstellen';
  $('#ap').autocomplete = signup ? 'new-password' : 'current-password';
}
async function doLogin(){
  const email = $('#ae').value.trim(), password = $('#ap').value, m = $('#amsg');
  if (!email || password.length < 6){ m.className = 'small err'; m.textContent = 'E-Mail und ein Passwort mit mindestens 6 Zeichen eingeben.'; return; }
  m.className = 'small muted'; m.textContent = 'Einen Moment …';
  const res = signup ? await sb.auth.signUp({ email, password, options: { data: { name: $('#an').value.trim() } } })
                     : await sb.auth.signInWithPassword({ email, password });
  if (res.error){ m.className = 'small err'; m.textContent = res.error.message === 'Invalid login credentials' ? 'E-Mail oder Passwort stimmt nicht.' : res.error.message; return; }
  if (!res.data.session){ m.className = 'small'; m.textContent = 'Fast geschafft: Bestätige deine E-Mail-Adresse über den Link in deinem Postfach und melde dich dann an.'; return; }
  S.user = res.data.session.user; boot();
}
async function boot(){
  if (S.user) LSS('spotter:user', { id: S.user.id, email: S.user.email, user_metadata: S.user.user_metadata || {} });
  try { await loadProfiles(); } catch (e) { showAuth('Profil konnte nicht geladen werden: ' + (e.message || e)); return; }
  applyTheme(S.me.data?.theme || 'auto');
  touchActive();
  await loadAvatars();
  document.body.classList.add('in'); render();
  setTimeout(maybeChangelog, 600);
  netUI(); syncQueue();
}
async function init(){
  if (!window.supabase){ $('#view').innerHTML = '<div class="auth"><h1>Ladefehler</h1><p>Eine Programmbibliothek konnte nicht geladen werden. Prüfe die Internetverbindung und lade die Seite neu. Tritt das dauerhaft auf, wurde die Bibliothek möglicherweise verändert und aus Sicherheitsgründen blockiert.</p></div>'; return; }
  if (!cfg.SUPABASE_URL || cfg.SUPABASE_URL.includes('DEIN-PROJEKT')){
    $('#view').innerHTML = '<div class="auth"><h1>Fast fertig</h1><p>Trag in der Datei <b>config.js</b> die Supabase-Adresse und den Schlüssel ein. Die Anleitung erklärt, wo du beides findest.</p></div>';
    return;
  }
  sb = supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
  sb.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_OUT'){ try { ['spotter:user','spotter:profiles','spotter:qc','spotter:wo-draft','spotter:queue'].forEach(k => localStorage.removeItem(k)); } catch (e) {} QUEUE = []; S.user = null; S.me = null; S.partner = null; S.myGame = null; Object.keys(GC).forEach(k => delete GC[k]); $('#lvl').classList.add('empty'); showAuth(); } });
  let session = null;
  try { session = (await sb.auth.getSession()).data.session; } catch (e) {}
  if (!session && !navigator.onLine){ const u = LSJ('spotter:user', null); if (u){ S.user = u; S.offline = true; boot(); return; } }
  if (session && inactiveTooLong()){ await sb.auth.signOut(); setLS('lastActive', '0'); showAuth('Du wurdest nach längerer Inaktivität automatisch abgemeldet.'); return; }
  if (session){ S.user = session.user; boot(); } else showAuth();
}
$('#prev').onclick = () => { S.day = addDays(S.day, -1); render(); };
$('#next').onclick = () => { if (S.day < today()){ S.day = addDays(S.day, 1); render(); } };
$('#dayl').onclick = () => { S.day = today(); render(); };
$('#tabs').onclick = e => { const b = e.target.closest('button'); if (b){ S.tab = b.dataset.tab; render(); window.scrollTo(0, 0); } };
let lastSeen = today();
document.addEventListener('visibilitychange', () => {
  if (document.hidden || !S.user || sheetOpen() || S.tab === 'profil') return;
  if (today() !== lastSeen){ if (S.day === lastSeen) S.day = today(); lastSeen = today(); }
  touchActive();
  loadProfiles().then(loadAvatars).then(render).catch(() => {});
});
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
init();
</script>
</body>
</html>
